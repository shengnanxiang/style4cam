<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT Studio - Editor</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --toolbar-bg: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.35);
            --accent: #ff9f43;
            --accent-glow: rgba(255, 159, 67, 0.35);
            --radius: 10px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* ---- Left Toolbar ---- */
        .toolbar {
            width: 64px;
            flex-shrink: 0;
            background: var(--toolbar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 8px;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        .tool-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        .tool-btn.accent:hover {
            color: var(--accent);
            background: rgba(255, 159, 67, 0.1);
            border-color: rgba(255, 159, 67, 0.3);
        }

        .tool-btn.danger:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .tool-divider {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        .tool-spacer {
            flex: 1;
        }

        /* ---- Main Preview ---- */
        .preview {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        .preview-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .preview-canvas.visible {
            display: block;
        }

        .upload-placeholder {
            text-align: center;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            color: rgba(255, 255, 255, 0.25);
        }

        .upload-title {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.05em;
        }

        .preview.has-image .upload-placeholder {
            opacity: 0;
        }

        .preview.drag-over {
            background: rgba(255, 159, 67, 0.04);
            box-shadow: inset 0 0 0 2px rgba(255, 159, 67, 0.35);
        }

        .preview input[type="file"] { display: none; }

        /* ---- Loading ---- */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .loading-overlay.visible { display: flex; }

        /* ---- 原图开关（图片底部居中浮层） ---- */
        .original-toggle {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(20, 20, 22, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
            cursor: pointer;
        }
        .preview:not(.has-image) .original-toggle { display: none; }
        .leak-reroll {
            font-size: 13px;
            color: var(--text);
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 4px 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .leak-reroll:hover { background: rgba(255, 255, 255, 0.2); color: var(--accent); }
        .original-toggle-text {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            border: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 0;
            transition: background 0.2s;
        }
        .switch.on { background: #ff9f43; }
        .switch-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }
        .switch.on .switch-knob { transform: translateX(18px); }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 18px var(--accent-glow);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* ---- Sidebar ---- */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .sidebar-count {
            font-size: 12px;
            color: var(--text-dim);
        }
        .sidebar-header > .sidebar-count {
            text-align: left;
        }

        /* ---- 预加载所有 ---- */
        .preload-btn {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .preload-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
        .preload-btn:disabled { opacity: 0.6; cursor: default; }
        .sidebar-btn-row { display: flex; gap: 8px; }
        .sidebar-btn-row .preload-btn { flex: 1; }
        .update-rank-btn { background: rgba(255, 159, 67, 0.16); border-color: rgba(255, 159, 67, 0.4); color: #ffb86b; }
        .update-rank-btn:hover { background: rgba(255, 159, 67, 0.28); }
        .update-rank-status {
            margin-top: 8px;
            font-size: 11.5px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.55);
        }
        .update-rank-status.is-ok { color: #4cd964; }
        .update-rank-status.is-err { color: #ff6b6b; }
        .preload-progress { width: 100%; }
        .preload-bar {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .preload-bar-fill {
            height: 100%;
            width: 0%;
            background: #ff9f43;
            transition: width 0.2s;
        }
        .preload-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }
        .preload-text { font-size: 12px; color: var(--text-dim); }
        .preload-cancel {
            border: none;
            background: none;
            color: #ff6b6b;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .presets-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.12) transparent;
        }

        .presets-scroll::-webkit-scrollbar { width: 5px; }
        .presets-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 3px;
        }

        .preset-category { margin-bottom: 22px; }

        .category-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-item:hover { background: rgba(255, 255, 255, 0.04); }

        .preset-item.selected {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .preset-badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fff;
            flex-shrink: 0;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.25);
        }

        .preset-info { flex: 1; min-width: 0; }

        .preset-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preset-category-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .preset-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.15s ease;
        }

        .preset-item.selected .preset-check {
            opacity: 1;
            transform: scale(1);
        }

        /* ---- Tabs (风格 / 光影 / 颗粒) —— 扁平风格 ---- */
        .tabs {
            display: flex;
            gap: 0;
            padding: 0;
            flex: 0 0 auto;
            background: #141414;
        }
        .tab {
            flex: 1 1 0;
            padding: 12px 0;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }
        .tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
        .tab.active {
            color: #fff;
            background: var(--panel-bg);
            border-bottom-color: var(--accent);
        }
        .tab-panel {
            display: none;
            flex-direction: column;
            min-height: 0;
            flex: 1 1 auto;
        }
        .tab-panel.active { display: flex; }
        .light-badge { background: linear-gradient(135deg, #ffd27a, #ff8a3d); }
        .grain-badge { background: linear-gradient(135deg, #aab2c0, #5b6470); }
        .effect-none-badge { background: linear-gradient(135deg, #7f8c8d, #555555); }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        /* Category colors */
        .cat-fuji .preset-badge { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .cat-kodak .preset-badge { background: linear-gradient(135deg, #f39c12, #d35400); }
        .cat-negative .preset-badge { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-classic .preset-badge { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .cat-colors .preset-badge { background: linear-gradient(135deg, #e84393, #d63031); }
        .cat-retro .preset-badge { background: linear-gradient(135deg, #a0522d, #8b4513); }
        .cat-for-cam .preset-badge { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-original .preset-badge { background: linear-gradient(135deg, #7f8c8d, #555555); }
        .cat-flash .preset-badge { background: linear-gradient(135deg, #f7dc6f, #f0b429); }

        /* Ranking tier colors (from LUT ranking test) */
        .cat-top10 .preset-badge { background: linear-gradient(135deg, #f1c40f, #e67e22); }
        .cat-r11_15 .preset-badge { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .cat-r16_20 .preset-badge { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-r21_26 .preset-badge { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-r27_32 .preset-badge { background: linear-gradient(135deg, #7f8c8d, #576574); }

        .category-title .tier-count {
            color: var(--text-dim);
            font-weight: 400;
            font-size: 11px;
            margin-left: 6px;
        }

        /* ---- 其它风格：可折叠分组 ---- */
        .cat-download .category-title {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            margin: 0 0 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.15s;
        }
        .cat-download .category-title:hover {
            background: rgba(255, 255, 255, 0.09);
        }
        .cat-download .category-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .cat-download .cat-arrow {
            display: inline-block;
            font-size: 10px;
            color: var(--text-dim);
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .cat-download .cat-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cat-download.cat-open .cat-arrow { transform: rotate(90deg); }
        .cat-download .preset-list { margin: 0 4px; }
        .cat-download.cat-collapsed .preset-list { display: none; }

        /* Mobile */
        @media (max-width: 768px) {
            .toolbar { width: 52px; }
            .sidebar { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; transform: translateX(100%); transition: transform 0.25s; }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="app">
    <nav class="toolbar">
        <button class="tool-btn" id="backBtn" title="返回列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="tool-divider"></div>
        <button class="tool-btn accent" id="uploadBtn" title="上传图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="tool-btn" id="downloadBtn" title="下载效果" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <div class="tool-spacer"></div>
        <button class="tool-btn danger" id="deleteBtn" title="删除图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
    </nav>

    <div class="preview" id="preview">
        <canvas id="canvas" class="preview-canvas"></canvas>
        <div class="upload-placeholder" id="placeholder">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <div class="upload-title">点击或拖拽图片到此处</div>
            <div class="upload-hint">支持 JPG / PNG / WebP</div>
        </div>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">应用 LUT 中</div>
        </div>
        <div class="original-toggle" id="originalToggle">
            <span class="original-toggle-text">原图</span>
            <button type="button" class="switch" id="originalSwitch" role="switch" aria-checked="false">
                <span class="switch-knob"></span>
            </button>
            <button type="button" class="leak-reroll" id="leakRerollBtn" title="换个漏光" hidden>🎲 换漏光</button>
        </div>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <aside class="sidebar">
        <div class="tabs">
            <div class="tab active" data-tab="style" id="tabStyle">排名风格</div>
            <div class="tab" data-tab="download" id="tabDownload">其它风格</div>
            <div class="tab" data-tab="light" id="tabLight">光影</div>
            <div class="tab" data-tab="grain" id="tabGrain">颗粒</div>
        </div>

        <!-- 风格面板（自制） -->
        <div class="tab-panel active" id="panelStyle">
            <div class="sidebar-header">
                <div class="sidebar-count" id="presetCount">0 presets</div>
                <div class="sidebar-btn-row">
                    <button class="preload-btn" id="preloadBtn" type="button">预加载所有</button>
                    <button class="preload-btn update-rank-btn" id="updateRankBtn" type="button">更新排名</button>
                </div>
                <div class="update-rank-status" id="updateRankStatus" hidden></div>
                <div class="preload-progress" id="preloadProgress" hidden>
                    <div class="preload-bar"><div class="preload-bar-fill" id="preloadBarFill"></div></div>
                    <div class="preload-meta">
                        <span class="preload-text" id="preloadText">0 / 0</span>
                        <button class="preload-cancel" id="preloadCancel" type="button">取消</button>
                    </div>
                </div>
            </div>
            <div class="presets-scroll" id="presetsScroll">
                <div class="empty-state" id="loadingState">加载预设中...</div>
            </div>
        </div>

        <!-- 光影面板 -->
        <div class="tab-panel" id="panelLight">
            <div class="presets-scroll" id="lightListScroll">
                <div class="empty-state">加载光影预设中...</div>
            </div>
        </div>

        <!-- 颗粒面板 -->
        <div class="tab-panel" id="panelGrain">
            <div class="presets-scroll" id="grainListScroll">
                <div class="empty-state">加载颗粒预设中...</div>
            </div>
        </div>

        <!-- 其它风格面板 -->
        <div class="tab-panel" id="panelDownload">
            <div class="sidebar-header">
                <div class="sidebar-count" id="downloadCount">0 presets</div>
                <div class="sidebar-btn-row">
                    <button class="preload-btn" id="preloadDownloadBtn" type="button">预加载</button>
                </div>
                <div class="preload-progress" id="preloadDownloadProgress" hidden>
                    <div class="preload-bar"><div class="preload-bar-fill" id="preloadDownloadBarFill"></div></div>
                    <div class="preload-meta">
                        <span class="preload-text" id="preloadDownloadText">0 / 0</span>
                    </div>
                </div>
            </div>
            <div class="presets-scroll" id="downloadListScroll">
                <div class="empty-state">加载下载预设中...</div>
            </div>
        </div>
    </aside>
</div>

<script src="db.js"></script>
<script>
    const LUT_BASE = '.';
    // 所有 .cube 统一存放于该文件夹（不再按子目录分类）
    let LUT_DIR = 'lut';
    let lutIndex = null;
    let categoryOrder = [];
    // 分组仅用于展示排序，文件一律从 LUT_DIR 读取

    // 标准 Bradley-Terry MM 算法（与排名站已验证实现完全一致）
    // π_i = W_i / Σ_{j≠i} [ n_ij / (π_i + π_j) ]
    // 其中 n_ij = i 和 j 的两两对阵次数，W_i = i 的总胜场（不含平局）
    function computeBradleyTerry(counts, pairCounts, maxIter, tol) {
        maxIter = maxIter || RANK_MAX_ITER;
        tol = tol || RANK_CONVERGE;
        const ids = Object.keys(counts);
        const N = ids.length;
        if (N === 0) return {};
        let pi = {};
        ids.forEach(id => pi[id] = 1.0);
        const totalWins = {};
        ids.forEach(id => totalWins[id] = counts[id].wins);
        for (let it = 0; it < maxIter; it++) {
            const newPi = {};
            let maxDelta = 0;
            for (const i of ids) {
                const numer = totalWins[i];
                let denom = 0;
                for (const j of ids) {
                    if (i === j) continue;
                    const pk = i < j ? i + '|' + j : j + '|' + i;
                    const pairN = pairCounts[pk] || 0;
                    if (pairN === 0) continue;
                    denom += pairN / (pi[i] + pi[j]);
                }
                if (denom === 0) { newPi[i] = pi[i]; continue; }
                newPi[i] = numer / denom;
                maxDelta = Math.max(maxDelta, Math.abs(newPi[i] - pi[i]));
            }
            const mean = ids.reduce((s, id) => s + newPi[id], 0) / N;
            for (const id of ids) newPi[id] /= mean;
            pi = newPi;
            if (maxDelta < tol) break;
        }
        return pi;
    }

    function applyTiers(rankedItems, tierSizes) {
        const groups = [];
        let idx = 0;
        let t = 1;
        for (const size of tierSizes) {
            const slice = rankedItems.slice(idx, idx + size);
            if (slice.length === 0) break;
            groups.push({ tier: t, items: slice });
            idx += size;
            t += 1;
        }
        // 余下（不足一组）全部归入最后一组
        if (idx < rankedItems.length) {
            const last = groups[groups.length - 1];
            if (last) last.items = last.items.concat(rankedItems.slice(idx));
            else groups.push({ tier: t, items: rankedItems.slice(idx) });
        }
        return groups;
    }

    async function fetchRankJudgments() {
        // Supabase 项目默认 db_max_rows=1000，单次最多返回 1000 行。
        // 这里循环分页（offset 递增），确保超过 1000 条的评判也能全部纳入排名。
        const PAGE = 1000;
        let all = [];
        let offset = 0;
        while (true) {
            const url = RANK_SUPABASE_URL + '/rest/v1/judgments?test_id=eq.' +
                encodeURIComponent(RANK_TEST_ID) + '&select=*&order=lut_a&limit=' +

            const resp = await fetch(url, {
                headers: {
                    'apikey': RANK_SUPABASE_KEY,
                    'Authorization': 'Bearer ' + RANK_SUPABASE_KEY
                }
            });
            if (!resp.ok) throw new Error('Supabase 请求失败：' + resp.status);
            const rows = await resp.json();
            if (!Array.isArray(rows) || rows.length === 0) break;
            all = all.concat(rows);
            if (rows.length < PAGE) break;   // 已到末页
            offset += rows.length;
        }
        return all;

    // 将 judgments 转为候选成绩，标准 aggregate + Bradley-Terry，返回与 lut-list.json 同构的分组对象
    function buildRankGroups(judgments) {
        const lids = Object.keys(LUT_FILE_BY_LID);
        const byId = {};
        lids.forEach(lid => { byId[lid] = { wins: 0, losses: 0, ties: 0 }; });
        const pairCounts = {};   // "min|max" → 两两对阵次数

        // aggregate：按 voter_id|lut_a|lut_b 去重，统计胜/负/平 + 两两对阵次数
        const seen = new Set();
        for (const j of (judgments || [])) {
            const a = j.lut_a, b = j.lut_b, w = j.winner;
            if (!a || !b) continue;
            if (!byId[a] || !byId[b]) continue;          // 仅统计已知 LUT
            const k = (j.voter_id || '?') + '|' + a + '|' + b;
            if (seen.has(k)) continue;
            seen.add(k);
            // 两两对阵次数
            const pk = a < b ? a + '|' + b : b + '|' + a;
            pairCounts[pk] = (pairCounts[pk] || 0) + 1;
            if (w === 'tie') {
                byId[a].ties += 1;
                byId[b].ties += 1;
            } else if (w === a) {
                byId[a].wins += 1; byId[b].losses += 1;
            } else if (w === b) {
                byId[b].wins += 1; byId[a].losses += 1;
            }
        }

        // 标准 Bradley-Terry MM（输入 counts + pairCounts）
        const strength = computeBradleyTerry(byId, pairCounts);

        const lutItems = lids.map(lid => ({
            id: lid,
            name: LUT_FILE_BY_LID[lid].name,
            file: LUT_FILE_BY_LID[lid].file,
            netWins: byId[lid].wins - byId[lid].losses,
            strength: strength[lid] || 0
        }));

        const ranked = lutItems.slice().sort((p, q) => {
            const d = q.strength - p.strength;
            if (Math.abs(d) > 1e-9) return d;
            return q.netWins - p.netWins;
        });

        // 分档：Top N + 余下按 tiers 分区（与排名站 ranking 配置一致）
        const head = ranked.slice(0, RANK_TOP_N);
        const rest = ranked.slice(RANK_TOP_N);
        const tierGroups = [{ items: head }].concat(applyTiers(rest, RANK_TIERS));
        const groupMeta = [
            { id: 'top10', label: 'Top 10' },
            { id: 'r11_15', label: '11-15' },
            { id: 'r16_20', label: '16-20' },
            { id: 'r21_26', label: '21-26' },
            { id: 'r27_32', label: '27-32' }
        ];
        const groups = tierGroups.map((g, i) => {
            const meta = groupMeta[i] || { id: 'tier' + (i + 1), label: 'Tier ' + (i + 1) };
            return {
                id: meta.id,
                label: meta.label,
                luts: g.items.map(it => ({
                    name: it.name,
                    file: it.file
                }))
            };
        });
        // rank 为全局连续序号
        let r = 0;
        groups.forEach(g => g.luts.forEach(l => { r += 1; l.rank = r; }));
        return groups;
    }
