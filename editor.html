<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT Studio - Editor</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --toolbar-bg: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.35);
            --accent: #ff9f43;
            --accent-glow: rgba(255, 159, 67, 0.35);
            --radius: 10px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* ---- Left Toolbar ---- */
        .toolbar {
            width: 64px;
            flex-shrink: 0;
            background: var(--toolbar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 8px;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
        }

        .tool-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .tool-btn:active {
            transform: scale(0.95);
        }

        .tool-btn.accent:hover {
            color: var(--accent);
            background: rgba(255, 159, 67, 0.1);
            border-color: rgba(255, 159, 67, 0.3);
        }

        .tool-btn.danger:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .tool-divider {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        .tool-spacer {
            flex: 1;
        }

        /* ---- Main Preview ---- */
        .preview {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        .preview-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .preview-canvas.visible {
            display: block;
        }

        .upload-placeholder {
            text-align: center;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            color: rgba(255, 255, 255, 0.25);
        }

        .upload-title {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.05em;
        }

        .preview.has-image .upload-placeholder {
            opacity: 0;
        }

        .preview.drag-over {
            background: rgba(255, 159, 67, 0.04);
            box-shadow: inset 0 0 0 2px rgba(255, 159, 67, 0.35);
        }

        .preview input[type="file"] { display: none; }

        /* ---- Loading ---- */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .loading-overlay.visible { display: flex; }

        /* ---- 原图开关（图片底部居中浮层） ---- */
        .original-toggle {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(20, 20, 22, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
            cursor: pointer;
        }
        .preview:not(.has-image) .original-toggle { display: none; }
        .original-toggle-text {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            border: none;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 0;
            transition: background 0.2s;
        }
        .switch.on { background: #ff9f43; }
        .switch-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }
        .switch.on .switch-knob { transform: translateX(18px); }

        .loading-spinner {
            width: 38px;
            height: 38px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 18px var(--accent-glow);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* ---- Sidebar ---- */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .sidebar-count {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* ---- 预加载所有 ---- */
        .preload-btn {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .preload-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
        .preload-btn:disabled { opacity: 0.6; cursor: default; }
        .sidebar-btn-row { display: flex; gap: 8px; }
        .sidebar-btn-row .preload-btn { flex: 1; }
        .update-rank-btn { background: rgba(255, 159, 67, 0.16); border-color: rgba(255, 159, 67, 0.4); color: #ffb86b; }
        .update-rank-btn:hover { background: rgba(255, 159, 67, 0.28); }
        .update-rank-status {
            margin-top: 8px;
            font-size: 11.5px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.55);
        }
        .update-rank-status.is-ok { color: #4cd964; }
        .update-rank-status.is-err { color: #ff6b6b; }
        .preload-progress { width: 100%; }
        .preload-bar {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .preload-bar-fill {
            height: 100%;
            width: 0%;
            background: #ff9f43;
            transition: width 0.2s;
        }
        .preload-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }
        .preload-text { font-size: 12px; color: var(--text-dim); }
        .preload-cancel {
            border: none;
            background: none;
            color: #ff6b6b;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .presets-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.12) transparent;
        }

        .presets-scroll::-webkit-scrollbar { width: 5px; }
        .presets-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 3px;
        }

        .preset-category { margin-bottom: 22px; }

        .category-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .preset-item:hover { background: rgba(255, 255, 255, 0.04); }

        .preset-item.selected {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .preset-badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #fff;
            flex-shrink: 0;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.25);
        }

        .preset-info { flex: 1; min-width: 0; }

        .preset-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preset-category-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .preset-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.15s ease;
        }

        .preset-item.selected .preset-check {
            opacity: 1;
            transform: scale(1);
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        /* Category colors */
        .cat-fuji .preset-badge { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .cat-kodak .preset-badge { background: linear-gradient(135deg, #f39c12, #d35400); }
        .cat-negative .preset-badge { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-classic .preset-badge { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .cat-colors .preset-badge { background: linear-gradient(135deg, #e84393, #d63031); }
        .cat-retro .preset-badge { background: linear-gradient(135deg, #a0522d, #8b4513); }
        .cat-for-cam .preset-badge { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-original .preset-badge { background: linear-gradient(135deg, #7f8c8d, #555555); }
        .cat-flash .preset-badge { background: linear-gradient(135deg, #f7dc6f, #f0b429); }

        /* Ranking tier colors (from LUT ranking test) */
        .cat-top10 .preset-badge { background: linear-gradient(135deg, #f1c40f, #e67e22); }
        .cat-r11_15 .preset-badge { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .cat-r16_20 .preset-badge { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-r21_26 .preset-badge { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-r27_32 .preset-badge { background: linear-gradient(135deg, #7f8c8d, #576574); }

        .category-title .tier-count {
            color: var(--text-dim);
            font-weight: 400;
            font-size: 11px;
            margin-left: 6px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .toolbar { width: 52px; }
            .sidebar { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; transform: translateX(100%); transition: transform 0.25s; }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="app">
    <nav class="toolbar">
        <button class="tool-btn" id="backBtn" title="返回列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="tool-divider"></div>
        <button class="tool-btn accent" id="uploadBtn" title="上传图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="tool-btn" id="downloadBtn" title="下载效果" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <div class="tool-spacer"></div>
        <button class="tool-btn danger" id="deleteBtn" title="删除图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
    </nav>

    <div class="preview" id="preview">
        <canvas id="canvas" class="preview-canvas"></canvas>
        <div class="upload-placeholder" id="placeholder">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <div class="upload-title">点击或拖拽图片到此处</div>
            <div class="upload-hint">支持 JPG / PNG / WebP</div>
        </div>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">应用 LUT 中</div>
        </div>
        <div class="original-toggle" id="originalToggle">
            <span class="original-toggle-text">原图</span>
            <button type="button" class="switch" id="originalSwitch" role="switch" aria-checked="false">
                <span class="switch-knob"></span>
            </button>
        </div>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <div class="sidebar-title">风格</div>
                <div class="sidebar-count" id="presetCount">0 presets</div>
            </div>
            <div class="sidebar-btn-row">
                <button class="preload-btn" id="preloadBtn" type="button">预加载所有</button>
                <button class="preload-btn update-rank-btn" id="updateRankBtn" type="button">更新排名</button>
            </div>
            <div class="update-rank-status" id="updateRankStatus" hidden></div>
            <div class="preload-progress" id="preloadProgress" hidden>
                <div class="preload-bar"><div class="preload-bar-fill" id="preloadBarFill"></div></div>
                <div class="preload-meta">
                    <span class="preload-text" id="preloadText">0 / 0</span>
                    <button class="preload-cancel" id="preloadCancel" type="button">取消</button>
                </div>
            </div>
        </div>
        <div class="presets-scroll" id="presetsScroll">
            <div class="empty-state" id="loadingState">加载预设中...</div>
        </div>
    </aside>
</div>

<script src="db.js"></script>
<script>
    const LUT_BASE = '.';
    // 所有 .cube 统一存放于该文件夹（不再按子目录分类）
    let LUT_DIR = 'lut';
    let lutIndex = null;
    let categoryOrder = [];
    // 分组仅用于展示排序，文件一律从 LUT_DIR 读取
    let GROUP_LABELS = {};
    let LUT_META = {}; // filename -> { rank, name }

    // 分组 key 与文件名 -> 实际文件路径
    function lutPath(filename) {
        return LUT_DIR + '/' + filename;
    }

    // 解析缓存：filename -> {size, table}，避免每次点击重复解析 .cube
    const lutParseCache = new Map();
    // 渲染缓存：(imageId, lutKey) -> 离屏 canvas，LRU 上限避免大图占用过多内存
    const RENDER_CACHE_MAX = 16; // 放大以容纳后台预渲染的全部风格（预览分辨率下内存可控）
    const PREVIEW_MAX = 1600; // 屏幕预览渲染的最长边像素；导出仍用原图高清
    const renderCache = new Map();

    let showOriginal = false;     // 原图开关状态：true=显示原图
    let currentStyleKey = null;   // 当前选中的风格（原图开关关闭时显示）

    function getFirstStyleKey() {
        if (!categoryOrder.length) return null;
        for (const key of categoryOrder) {
            const files = lutIndex[key] || [];
            if (files.length) return lutPath(files[0]);
        }
        return null;
    }

    // styleKey 形如 "lut/xxx.cube"，仅拆首个 '/'，避免文件名含 '/' 时出错
    function splitStyleKey(styleKey) {
        const i = styleKey.indexOf('/');
        return i < 0
            ? ['', styleKey]
            : [styleKey.slice(0, i), styleKey.slice(i + 1)];
    }

    const DISPLAY_MAP = {
        'for cam': {
            '1.portrait-fujiNC2 48': 'fujiNC2 48',
            '2.Scenery-fujiNN': 'fujiNN',
            '3.portrait-Florida2': 'Florida2',
            '4.Food-fugumeishi': '复古美食',
            '5.Food-xinxian': '新鲜',
            '6.portrait-deepblue': 'deepblue',
            '7.night-yejing11': '夜景11',
        }
    };

    const CATEGORY_LABELS = {
        'fuji': 'Fuji',
        'kodak': 'Kodak',
        'negative': 'Negative',
        'classic': 'Classic',
        'colors': 'Colors',
        'retro': 'Retro',
        'for cam': 'For Cam',
        'flash': 'Flash',
        'lab': 'Lab',
        'movie': 'Movie',
        'original': 'Original'
    };

    const BADGE_TEXT = {
        'fuji': 'FU',
        'kodak': 'KO',
        'negative': 'NE',
        'classic': 'CL',
        'colors': 'CO',
        'retro': 'RE',
        'for cam': 'FC',
        'flash': 'FL',
        'lab': 'LA',
        'movie': 'MO',
        'original': 'OR'
    };

    // 每个 LUT 按名称特点配色（仅作用于图标底色）
    // 每个 LUT 的圆点图标配色（与风格语义匹配，渐变更精致），覆盖全部 32 个
    const LUT_COLORS = {
        '日系1996': 'linear-gradient(135deg, #ffafcc, #a2d2ff)',
        '交叉冲洗': 'linear-gradient(135deg, #06d6a0, #ef476f)',
        '彩色负片100T': 'linear-gradient(135deg, #f4a261, #e76f51)',
        '摩卡': 'linear-gradient(135deg, #a47148, #6f4518)',
        '电影感': 'linear-gradient(135deg, #264653, #e9c46a)',
        '霸王别姬·蓝': 'linear-gradient(135deg, #48cae4, #023e8a)',
        '回忆录': 'linear-gradient(135deg, #c8975a, #8a5a2b)',
        '彩色反转T64': 'linear-gradient(135deg, #83c5be, #006d77)',
        '霸王别姬·红': 'linear-gradient(135deg, #e5383b, #9d0208)',
        '人像琥珀提亮': 'linear-gradient(135deg, #ffb703, #fb8500)',
        '黑白老照片 2': 'linear-gradient(135deg, #9c8b7a, #5c4f43)',
        '怀旧绿': 'linear-gradient(135deg, #74c69d, #2d6a4f)',
        '柏林之冬': 'linear-gradient(135deg, #8d99ae, #2b2d42)',
        '蓝调时光': 'linear-gradient(135deg, #4895ef, #3a0ca3)',
        '漂白旁路': 'linear-gradient(135deg, #adb5bd, #495057)',
        '奥林帕斯': 'linear-gradient(135deg, #80ed99, #38a3a5)',
        '复古风': 'linear-gradient(135deg, #e9a06b, #b5651d)',
        '黑白纪实': 'linear-gradient(135deg, #b0b0b0, #6c6c6c)',
        '低饱和蓝晒': 'linear-gradient(135deg, #5e9ed6, #1b4965)',
        '千禧电影': 'linear-gradient(135deg, #ff8fab, #90e0ef)',
        '重庆森林 (f)': 'linear-gradient(135deg, #52b788, #1b4332)',

    function computeBradleyTerry(items, preferenceToWin) {
        const n = items.length;
        const ids = items.map(it => it.id);
        const gamma = {};
        ids.forEach(id => { gamma[id] = 1.0; });
        // 累加胜场数与对手强度
        const wins = {};
        const denom = {};
        ids.forEach(id => { wins[id] = 0; denom[id] = 0; });
        items.forEach(a => {
            items.forEach(b => {
                if (a.id === b.id) return;
                if (preferenceToWin(a, b)) wins[a.id] += 1;
                denom[a.id] += gamma[b.id] / (gamma[a.id] + gamma[b.id]);
            });
        });
        for (let iter = 0; iter < RANK_MAX_ITER; iter++) {
            let maxDelta = 0;
            ids.forEach(id => {
                const newG = wins[id] / denom[id];
                maxDelta = Math.max(maxDelta, Math.abs(newG - gamma[id]));
                gamma[id] = newG;
            });
            if (maxDelta < RANK_CONVERGE) break;
        }
        const total = ids.reduce((s, id) => s + gamma[id], 0);
        ids.forEach(id => { gamma[id] /= total; });
        return gamma;
    }

    function applyTiers(rankedItems, tierSizes) {
        const groups = [];
        let idx = 0;
        let t = 1;
        for (const size of tierSizes) {
            const slice = rankedItems.slice(idx, idx + size);
            if (slice.length === 0) break;
            groups.push({ tier: t, items: slice });
            idx += size;
            t += 1;
        }
        // 余下（不足一组）全部归入最后一组
        if (idx < rankedItems.length) {
            const last = groups[groups.length - 1];
            if (last) last.items = last.items.concat(rankedItems.slice(idx));
            else groups.push({ tier: t, items: rankedItems.slice(idx) });
        }
        return groups;
    }

    // 将 judgments 转为候选成绩，重算排名，返回与 lut-list.json 同构的分组对象
    function buildRankGroups(judgments) {
        const lids = Object.keys(LUT_FILE_BY_LID);
        const lutItems = lids.map(lid => ({
            id: lid,
            name: LUT_FILE_BY_LID[lid].name,
            file: LUT_FILE_BY_LID[lid].file,
            scores: { A: 0, B: 0, C: 0 },
            netWins: 0
        }));
        const byId = {};
        lutItems.forEach(it => { byId[it.id] = it; });

        for (const j of judgments) {
            const a = byId[j.choice_a], b = byId[j.choice_b], c = byId[j.choice_c];
            if (!a || !b || !c) continue;
            a.scores.A += 1; b.scores.B += 1; c.scores.C += 1;
        }
        lutItems.forEach(it => {
            it.netWins = it.scores.A * 2 + it.scores.B * 1 - (it.scores.C * 2 + it.scores.B * 1);
        });

        const gamma = computeBradleyTerry(lutItems, (x, y) => x.scores.A >= y.scores.A && x.scores.B >= y.scores.B);
        lutItems.forEach(it => { it.strength = gamma[it.id]; });

        const ranked = lutItems.slice().sort((p, q) => {
            const d = q.strength - p.strength;
            if (Math.abs(d) > 1e-9) return d;
            return q.netWins - p.netWins;
        });

        const tierGroups = applyTiers(ranked, RANK_TIERS);
        const groupMeta = [
            { id: 'top10', label: 'Top 10' },
            { id: 'r11_15', label: '11-15' },
            { id: 'r16_20', label: '16-20' },
            { id: 'r21_26', label: '21-26' },
            { id: 'r27_32', label: '27-32' }
        ];
        const groups = tierGroups.map((g, i) => {
            const meta = groupMeta[i] || { id: 'tier' + (i + 1), label: 'Tier ' + (i + 1) };
            return {
                id: meta.id,
                label: meta.label,
                luts: g.items.map(it => ({
                    name: it.name,
                    file: it.file
                }))
            };
        });
        // rank 为全局连续序号
        let r = 0;
        groups.forEach(g => g.luts.forEach(l => { r += 1; l.rank = r; }));
        return groups;
    }

        const items = allLutUrls();
        if (!items.length) return;
        try {
            const cache = await caches.open(LUT_CACHE);
            let cached = 0;
            for (const url of items) {
                if (await cache.match(url)) cached++;
            }
            if (cached === items.length) {
                setPreloadUI('done', cached, items.length);
            } else if (cached > 0) {
                preloadBtn.hidden = false;
                preloadProgress.hidden = true;
                preloadBtn.textContent = '继续预加载 (' + cached + '/' + items.length + ')';

    async function preloadAll() {
        if (!('caches' in window)) {
            alert('当前浏览器不支持缓存预加载，请改用现代浏览器（Chrome / Edge / Firefox / Safari）。');
            return;
        }
        const items = allLutUrls();
        const total = items.length;
        if (!total) return;

        preloadAborted = false;
        setPreloadUI('running', 0, total);
        let done = 0;
        try {
            const cache = await caches.open(LUT_CACHE);
            for (const url of items) {
                if (preloadAborted) break;
                try {
                    const hit = await cache.match(url);
                    if (!hit) {
                        preloadController = new AbortController();
                        const resp = await fetch(url, { signal: preloadController.signal });
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        await cache.put(url, resp.clone());
                    }
                } catch (e) {
                    if (preloadAborted) break;
                    console.warn('预加载失败（已跳过）:', url, e);
                }
                done++;
                setPreloadUI('running', done, total);
            }
        } catch (e) {
            console.error('预加载异常:', e);
        } finally {
            preloadController = null;
        }
        setPreloadUI(preloadAborted ? 'idle' : 'done', done, total);
    }

    function parseCubeFile(text) {
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/^\uFEFF/, '');
        const lines = text.split('\n').map(l => l.trim());
        let size = 0;
        const values = [];

        for (const line of lines) {
            if (!line || line.startsWith('#') || line.startsWith('//')) continue;
            const parts = line.split(/\s+/);
            if (parts[0] === 'TITLE') continue;
            if (parts[0] === 'DOMAIN_MIN' || parts[0] === 'DOMAIN_MAX') continue;
            if (parts[0] === 'LUT_3D_SIZE') {
                size = parseInt(parts[1]);
                continue;
            }
            if (parts.length >= 3) {
                const r = parseFloat(parts[0]);
                const g = parseFloat(parts[1]);
                const b = parseFloat(parts[2]);
                if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                    values.push(r, g, b);
                }
            }
        }

        if (!size || values.length !== size * size * size * 3) {
            throw new Error('Invalid .cube file (size=' + size + ', values=' + values.length + ')');
        }
        return { size, table: new Float32Array(values) };
    }

    function applyLUTToPixels(srcPixels, w, h, lut) {
        const { size, table } = lut;
        const maxIdx = size - 1;
        const n = size * size;
        const dst = new Uint8ClampedArray(srcPixels.length);

        for (let i = 0; i < srcPixels.length; i += 4) {
            const r = srcPixels[i]     / 255;
            const g = srcPixels[i + 1] / 255;
            const b = srcPixels[i + 2] / 255;
            const a = srcPixels[i + 3];

            const rf = Math.min(r * maxIdx, maxIdx);
            const gf = Math.min(g * maxIdx, maxIdx);
            const bf = Math.min(b * maxIdx, maxIdx);

            const r0 = Math.floor(rf);
            const g0 = Math.floor(gf);
            const b0 = Math.floor(bf);
            const r1 = Math.min(r0 + 1, maxIdx);
            const g1 = Math.min(g0 + 1, maxIdx);
            const b1 = Math.min(b0 + 1, maxIdx);

            const dr = rf - r0;
            const dg = gf - g0;
            const db = bf - b0;

            const idx000 = (b0 * n + g0 * size + r0) * 3;
            const idx100 = (b0 * n + g0 * size + r1) * 3;
            const idx010 = (b0 * n + g1 * size + r0) * 3;
            const idx110 = (b0 * n + g1 * size + r1) * 3;
            const idx001 = (b1 * n + g0 * size + r0) * 3;
            const idx101 = (b1 * n + g0 * size + r1) * 3;
            const idx011 = (b1 * n + g1 * size + r0) * 3;
            const idx111 = (b1 * n + g1 * size + r1) * 3;

            for (let c = 0; c < 3; c++) {
                const c00 = table[idx000 + c] * (1 - dr) + table[idx100 + c] * dr;
                const c01 = table[idx001 + c] * (1 - dr) + table[idx101 + c] * dr;
                const c10 = table[idx010 + c] * (1 - dr) + table[idx110 + c] * dr;
                const c11 = table[idx011 + c] * (1 - dr) + table[idx111 + c] * dr;
                const c0  = c00 * (1 - dg) + c10 * dg;
                const c1  = c01 * (1 - dg) + c11 * dg;
                const val = c0 * (1 - db) + c1 * db;
                dst[i + c] = Math.round(Math.max(0, Math.min(1, val)) * 255);
            }
            dst[i + 3] = a;
        }
        return dst;
    }

    function renderCacheKey(lutKey) {
        return (currentImageId || 'img') + '::' + (lutKey || selectedLutKey || 'original');
    }

    function previewDims() {
        const nw = sourceImage.naturalWidth || sourceImage.width;
        const nh = sourceImage.naturalHeight || sourceImage.height;
        const scale = Math.min(1, PREVIEW_MAX / Math.max(nw, nh));
        return { w: Math.max(1, Math.round(nw * scale)), h: Math.max(1, Math.round(nh * scale)) };
    }

    function render() {
        if (!sourceImage) return;
        const key = renderCacheKey();
        const cached = renderCache.get(key);
        if (cached) {
            // 命中渲染缓存：直接绘制，跳过全图 getImageData + 逐像素应用
            renderCache.delete(key);
            renderCache.set(key, cached);
            canvas.width = cached.width;
            canvas.height = cached.height;
            ctx.drawImage(cached, 0, 0);
            return;
        }
        // 预览按降分辨率渲染（PREVIEW_MAX），导出时再单独跑全分辨率
        const { w, h } = previewDims();
        paintCanvas(canvas, w, h, lutData);
        cacheRender(key, canvas);
    }

    // 把 sourceImage 按给定尺寸绘制并套用 LUT，写入 targetCanvas
    function paintCanvas(targetCanvas, w, h, lut) {
        targetCanvas.width = w;
        targetCanvas.height = h;
        const tctx = targetCanvas.getContext('2d');
        tctx.drawImage(sourceImage, 0, 0, w, h);
        if (lut) {
            const imageData = tctx.getImageData(0, 0, w, h);
            imageData.data.set(applyLUTToPixels(imageData.data, w, h, lut));
            tctx.putImageData(imageData, 0, 0);
        }
    }

    function cacheRender(key, srcCanvas) {
        const off = document.createElement('canvas');
        off.width = srcCanvas.width;
        off.height = srcCanvas.height;
        off.getContext('2d').drawImage(srcCanvas, 0, 0);
        renderCache.set(key, off);
        while (renderCache.size > RENDER_CACHE_MAX) {
            const oldest = renderCache.keys().next().value;
            renderCache.delete(oldest);
        }
    }

    // 选图后后台预渲染全部风格（降分辨率），使之后点哪个都秒出
    let prerenderToken = 0;
    async function prerenderAll() {
        if (!sourceImage || !categoryOrder || !lutIndex) return;
        const token = ++prerenderToken;
        const imgId = currentImageId || 'img';
        const { w, h } = previewDims();
        for (const key of categoryOrder) {
            for (const fname of (lutIndex[key] || [])) {
                if (token !== prerenderToken) return; // 图片已切换，中止后台任务
                const styleKey = lutPath(fname);
                const rk = imgId + '::' + styleKey;
                if (renderCache.has(rk)) continue; // 已渲染（如用户已点过）
                try {
                    const text = await loadLutContent(key, fname);
                    const pkey = styleKey;
                    let lut = lutParseCache.get(pkey);
                    if (!lut) { lut = parseCubeFile(text); lutParseCache.set(pkey, lut); }
                    const off = document.createElement('canvas');
                    paintCanvas(off, w, h, lut);
                    renderCache.set(rk, off);
                    while (renderCache.size > RENDER_CACHE_MAX) {
                        const oldest = renderCache.keys().next().value;
                        renderCache.delete(oldest);
                    }
                } catch (e) { console.warn('预渲染失败（已跳过）:', styleKey, e); }
                await new Promise(r => setTimeout(r, 0)); // 让出主线程，避免卡顿
            }
        }
    }

    function buildPresets() {
        if (!lutIndex) return;
        presetsScroll.innerHTML = '';

        let total = 0;
        const categories = (categoryOrder || Object.keys(lutIndex)).map(key => {
            return { key, label: getCategoryTitle(key) };
        });

        const allCategories = categories;

        for (const cat of allCategories) {
            const categoryEl = document.createElement('div');
            categoryEl.className = 'preset-category cat-' + cat.key.replace(/\s+/g, '-');
            const files = lutIndex[cat.key] || [];
            if (!files.length) continue;
            total += files.length;

            const titleText = getCategoryTitle(cat.key);
            if (titleText) {
                categoryEl.innerHTML = '<div class="category-title">' + titleText
                    + '<span class="tier-count">' + files.length + '</span></div>';
            }

            const list = document.createElement('div');
            list.className = 'preset-list';

            for (const fname of files) {
                const display = formatLutName(cat.key, fname);
                const key = lutPath(fname);
                const item = document.createElement('div');
                item.className = 'preset-item';
                if (selectedLutKey === key) item.classList.add('selected');
                item.innerHTML = `
                    <div class="preset-badge" style="background:${getLutColor(cat.key, fname)}">${display.charAt(0)}</div>
                    <div class="preset-info">
                        <div class="preset-name">${display}</div>
                        <div class="preset-category-label">${getLutDesc(cat.key, fname)}</div>
                    </div>
                    <div class="preset-check">✓</div>
                `;
                item.addEventListener('click', () => selectLut(cat.key, fname));
                list.appendChild(item);
            }

            categoryEl.appendChild(list);
            presetsScroll.appendChild(categoryEl);
        }

        presetCount.textContent = total + ' preset' + (total === 1 ? '' : 's');
    }

    async function selectLut(category, filename) {
        currentStyleKey = lutPath(filename);
        showOriginal = false;
        updateOriginalSwitch();
        selectedLutKey = currentStyleKey;
        // 渲染缓存已命中时 Everything 都已本地就绪，无需再显示等待遮罩
        const instant = renderCache.has(renderCacheKey());
        if (!instant) loadingOverlay.classList.add('visible');
        buildPresets();

        try {
            const text = await loadLutContent(category, filename);
            const pkey = lutPath(filename);
            let lut = lutParseCache.get(pkey);
            if (!lut) {
                lut = parseCubeFile(text);
                lutParseCache.set(pkey, lut);
            }
            lutData = lut;
            render();
        } catch (err) {
            alert('LUT 加载失败: ' + err.message);
            selectedLutKey = null;
            lutData = null;
            buildPresets();
        } finally {
            loadingOverlay.classList.remove('visible');
        }
    }

    function updateOriginalSwitch() {
        originalSwitch.classList.toggle('on', showOriginal);
        originalSwitch.setAttribute('aria-checked', showOriginal ? 'true' : 'false');
    }

    // 原图开关：on=显示原图，off=显示当前选中的风格
    function setShowOriginal(on) {
        showOriginal = on;
        updateOriginalSwitch();
        if (on) {
            selectedLutKey = null;
            lutData = null;
            buildPresets();
            render();
        } else {
            if (!currentStyleKey) currentStyleKey = getFirstStyleKey();
            if (currentStyleKey) {
                const [cat, fname] = splitStyleKey(currentStyleKey);
                selectLut(cat, fname);
            } else {
                selectedLutKey = null;
                lutData = null;
                buildPresets();
                render();
            }
        }
    }

    function setImageLoaded(img, name) {
        // 换了图片，旧的渲染缓存（按 imageId 区分）已失效，清空释放内存
        renderCache.clear();
        sourceImage = img;
        hasImage = true;
        preview.classList.add('has-image');
        canvas.classList.add('visible');
        downloadBtn.disabled = false;
        currentImageName = name || 'image.jpg';
        // 默认选中第一个风格，原图开关关闭
        currentStyleKey = getFirstStyleKey();
        showOriginal = false;
        updateOriginalSwitch();
        if (currentStyleKey) {
            const [cat, fname] = splitStyleKey(currentStyleKey);
            selectLut(cat, fname);
        } else {
            selectedLutKey = null;
            lutData = null;
            buildPresets();
            render();
        }
        // 选图后后台预渲染全部风格，使之后点哪个都秒出（不再有"应用Lut中"）
        prerenderAll();
    }

    async function loadImageFromDB(id) {
        const item = await getImage(id);
        if (!item) {
            alert('找不到该图片，将返回列表');
            location.href = 'index.html';
            return;
        }
        currentImageId = id;
        currentImageName = item.name;
        const img = new Image();
        img.onload = () => setImageLoaded(img, item.name);
        img.src = item.dataUrl;
    }

    async function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('请选择有效的图片文件（JPG / PNG / WebP）');
            return;
        }
        try {
            const dataUrl = await fileToDataUrl(file);
            const id = await saveImage(file.name, dataUrl);
            location.href = 'editor.html?id=' + encodeURIComponent(id);
        } catch (err) {
            alert('图片保存失败: ' + err.message);
        }
    }

    function downloadImage() {
        if (!hasImage) return;
        const link = document.createElement('a');
        const base = currentImageName.replace(/\.[^/.]+$/, '');
        const lutSuffix = selectedLutKey
            ? '-' + selectedLutKey.replace(/\//g, '-').replace(/\.(cube|CUBE)$/, '')
            : '-original';
        link.download = base + lutSuffix + '.jpg';
        // 导出用原图全分辨率渲染（不受预览降分辨率影响）；JPG 不支持透明通道，先铺白底
        const nw = sourceImage.naturalWidth || sourceImage.width;
        const nh = sourceImage.naturalHeight || sourceImage.height;
        const out = document.createElement('canvas');
        out.width = nw;
        out.height = nh;
        const octx = out.getContext('2d');
        octx.fillStyle = '#ffffff';
        octx.fillRect(0, 0, nw, nh);
        octx.drawImage(sourceImage, 0, 0, nw, nh);
        if (lutData) {
            const imageData = octx.getImageData(0, 0, nw, nh);
            imageData.data.set(applyLUTToPixels(imageData.data, nw, nh, lutData));
            octx.putImageData(imageData, 0, 0);
        }
        link.href = out.toDataURL('image/jpeg', 0.92);
        link.click();
    }

    async function deleteCurrentImage() {
        if (!currentImageId) return;
        if (!confirm('确定要删除这张图片吗？')) return;
        try {
            await deleteImage(currentImageId);
            location.href = 'index.html';
        } catch (err) {
            alert('删除失败: ' + err.message);
        }
    }

    // ---- Events ----
    backBtn.addEventListener('click', () => location.href = 'index.html');
    uploadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        imageInput.click();
    });
    downloadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        downloadImage();
    });
    deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCurrentImage();
    });

    preview.addEventListener('click', () => imageInput.click());
    originalToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        setShowOriginal(!showOriginal);
    });
    preloadBtn.addEventListener('click', preloadAll);
    preloadCancel.addEventListener('click', cancelPreload);

    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleImageFile(e.target.files[0]);
    });

    preview.addEventListener('dragover', (e) => {
        e.preventDefault();
        preview.classList.add('drag-over');
    });

    preview.addEventListener('dragleave', () => {
        preview.classList.remove('drag-over');
    });

    preview.addEventListener('drop', (e) => {
        e.preventDefault();
        preview.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) handleImageFile(e.dataTransfer.files[0]);
    });

    // ---- Init ----
    const imageId = getUrlParam('id');
    if (imageId) {
        loadImageFromDB(imageId);
    }
</script>

</body>
