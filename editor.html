            statusEl.textContent = '已更新至最新排名（' + judgments.length + ' 条评判，' + t + '）';
        } catch (e) {
            console.error(e);
            statusEl.className = 'update-rank-status is-err';
            statusEl.textContent = '更新失败：' + (e && e.message ? e.message : e) + '（仍使用已加载的排名）';
        } finally {
            btn.disabled = false;
            btn.textContent = '更新排名';
        }
    }

    // 把分组 payload 应用到内存并重建 UI（overridden=true 表示来自实时更新）
    function applyRankPayload(data, overridden) {
        LUT_DIR = data.dir || LUT_DIR;
        lutIndex = {};
        categoryOrder = [];
        GROUP_LABELS = {};
        LUT_META = {};
        for (const g of (data.groups || [])) {
            const key = g.id;
            categoryOrder.push(key);
            GROUP_LABELS[key] = g.label || key;
            lutIndex[key] = (g.luts || []).map(item => {
                LUT_META[item.file] = { rank: item.rank, name: item.name };
                return item.file;
            });
        }
        buildPresets();
        refreshPreloadState();
        if (overridden) {
            document.getElementById('presetCount').textContent =
                categoryOrder.reduce((s, k) => s + (lutIndex[k] ? lutIndex[k].length : 0), 0) + ' presets · 实时';
        }
    }

    function loadRankOverride() {
        try {
            const raw = localStorage.getItem(RANK_STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (!data || !Array.isArray(data.groups) || data.groups.length === 0) return false;
            applyRankPayload(data, true);
            return true;
        } catch (e) {
            return false;
        }
    }

    document.getElementById('updateRankBtn').addEventListener('click', refreshRanking);

    // ---- URL params ----
    function getUrlParam(name) {
        const params = new URLSearchParams(location.search);
        return params.get(name);
    }

    async function loadLutIndex() {
        try {
            const resp = await fetch('lut-list.json?v=10');
            if (!resp.ok) throw new Error('Failed to load lut-list.json');
            const data = await resp.json();
            applyRankPayload(data, false);
            // 若有本地实时更新缓存，则覆盖快照
            loadRankOverride();
            // 页面加载时自动拉取一次最新排名（每日至多一次，避免重复请求）
            autoRefreshRankingOnce();
        } catch (e) {
            console.error('Failed to load lut-list.json:', e);
            presetsScroll.innerHTML = '<div class="empty-state">无法加载预设列表</div>';
        }
    }

    // 每日自动同步一次排名：用 localStorage 记录上次同步日期
    function autoRefreshRankingOnce() {
        try {
            const today = new Date().toISOString().slice(0, 10);
            const last = localStorage.getItem(RANK_STORAGE_KEY + '.autoDate');
            if (last === today) return; // 今天已自动同步过
            refreshRanking().finally(() => {
                localStorage.setItem(RANK_STORAGE_KEY + '.autoDate', today);
            });
        } catch (e) { /* 忽略，不影响主流程 */ }
    }

    loadLutIndex();
    loadDownloadList();

    const LUT_CACHE = 'lut-cache-v1';

    // 统一用绝对地址（相对地址 + 中文文件名会让 Cache Storage 静默失败）
    function lutAbsUrl(path) {
        return new URL(LUT_BASE + '/' + path, location.href).href;
    }

    async function fetchLutFile(path) {
        const url = lutAbsUrl(path);
        if ('caches' in window) {
            try {
                const hit = await caches.match(url);
                if (hit) return await hit.text();
            } catch (e) { /* 缓存读取失败则走网络 */ }
        }
        let resp = await fetch(url);
        if (!resp.ok) {
            // 扩展名大小写容错：.cube <-> .CUBE（跨平台/大小写敏感服务器）
            const altPath = path.replace(/\.cube$/i, m => m === '.cube' ? '.CUBE' : '.cube');
            if (altPath !== path) {
                resp = await fetch(lutAbsUrl(altPath));
            }
        }
        if (!resp.ok) throw new Error('Failed to load: ' + path);
        if ('caches' in window) {
            try {
                const clone = resp.clone();
                const cache = await caches.open(LUT_CACHE);
                await cache.put(url, clone);
            } catch (e) { /* 缓存写入失败不影响使用 */ }
        }
        return await resp.text();
    }

    // 显式“预加载所有”：用户点击后顺序下载并写入缓存，带进度与取消
    let preloadAborted = false;
    let preloadController = null;

    function allLutUrls() {
        const seen = new Set();
        const urls = [];
        for (const key of categoryOrder) {
            for (const f of (lutIndex[key] || [])) {
                if (seen.has(f)) continue;
                seen.add(f);
                urls.push(lutAbsUrl(lutPath(f)));
            }
        }
        return urls;
    }

    function setPreloadUI(state, done, total) {
        if (state === 'idle') {
            preloadBtn.hidden = false;
            preloadProgress.hidden = true;
            preloadBtn.textContent = '预加载所有';
            preloadBtn.disabled = false;
        } else if (state === 'running') {
            preloadBtn.hidden = true;
            preloadProgress.hidden = false;
            const pct = total ? Math.round((done / total) * 100) : 0;
            preloadBarFill.style.width = pct + '%';
            preloadText.textContent = done + ' / ' + total + '  (' + pct + '%)';
        } else if (state === 'done') {
            preloadBtn.hidden = false;
            preloadProgress.hidden = true;
            preloadBtn.textContent = '✓ 已预加载 (' + done + '/' + total + ')';
            preloadBtn.disabled = false;
        }
    }

    // 进入页面时，根据已缓存情况刷新按钮文案
    async function refreshPreloadState() {
        if (!('caches' in window)) return;
        const items = allLutUrls();
        if (!items.length) return;
        try {
            const cache = await caches.open(LUT_CACHE);
            let cached = 0;
            for (const url of items) {
                if (await cache.match(url)) cached++;
            }
            if (cached === items.length) {
                setPreloadUI('done', cached, items.length);
            } else if (cached > 0) {
                preloadBtn.hidden = false;
                preloadProgress.hidden = true;
                preloadBtn.textContent = '继续预加载 (' + cached + '/' + items.length + ')';
                preloadBtn.disabled = false;
            }
        } catch (e) { /* 忽略 */ }
    }

    async function preloadAll() {
        if (!('caches' in window)) {
            alert('当前浏览器不支持缓存预加载，请改用现代浏览器（Chrome / Edge / Firefox / Safari）。');
            return;
        }
        const items = allLutUrls();
        const total = items.length;
        if (!total) return;

        preloadAborted = false;
        setPreloadUI('running', 0, total);
        let done = 0;
        try {
            const cache = await caches.open(LUT_CACHE);
            for (const url of items) {
                if (preloadAborted) break;
                try {
                    const hit = await cache.match(url);
                    if (!hit) {
                        preloadController = new AbortController();
                        const resp = await fetch(url, { signal: preloadController.signal });
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        await cache.put(url, resp.clone());
                    }
                } catch (e) {
                    if (preloadAborted) break;
                    console.warn('预加载失败（已跳过）:', url, e);
                }
                done++;
                setPreloadUI('running', done, total);
            }
        } catch (e) {
            console.error('预加载异常:', e);
        } finally {
            preloadController = null;
        }
        setPreloadUI(preloadAborted ? 'idle' : 'done', done, total);
    }

    function cancelPreload() {
        preloadAborted = true;
        if (preloadController) preloadController.abort();
    }

    async function loadLutContent(category, filename) {
        const path = category === DOWNLOAD_DIR ? downloadPath(filename) : lutPath(filename);
        return await fetchLutFile(path);
    }

    function formatLutName(category, filename) {
        const meta = LUT_META[filename];
        if (meta && meta.name) return meta.name;
        const base = filename.replace(/\.(cube|CUBE)$/, '');
        if (DISPLAY_MAP[category] && DISPLAY_MAP[category][base]) {
            return DISPLAY_MAP[category][base];
        }
        return base;
    }

    function parseCubeFile(text) {
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/^\uFEFF/, '');
        const lines = text.split('\n').map(l => l.trim());
        let size = 0;
        const values = [];

        for (const line of lines) {
            if (!line || line.startsWith('#') || line.startsWith('//')) continue;
            const parts = line.split(/\s+/);
            if (parts[0] === 'TITLE') continue;
            if (parts[0] === 'DOMAIN_MIN' || parts[0] === 'DOMAIN_MAX') continue;
            if (parts[0] === 'LUT_3D_SIZE') {
                size = parseInt(parts[1]);
                continue;
            }
            if (parts.length >= 3) {
                const r = parseFloat(parts[0]);
                const g = parseFloat(parts[1]);
                const b = parseFloat(parts[2]);
                if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                    values.push(r, g, b);
                }
            }
        }

        if (!size || values.length !== size * size * size * 3) {
            throw new Error('Invalid .cube file (size=' + size + ', values=' + values.length + ')');
        }
        let table = new Float32Array(values);
        // 低分辨率 LUT（size < 33）升采样到 33：三线性插值，避免小尺寸 LUT 套用出现明显色阶断裂
        if (size < 33) {
            const TARGET = 33;
            const srcN = size;
            const out = new Float32Array(TARGET * TARGET * TARGET * 3);
            const n = TARGET * TARGET;
            const s = new Float32Array(3);
            for (let b = 0; b < TARGET; b++) {
                for (let g = 0; g < TARGET; g++) {
                    for (let r = 0; r < TARGET; r++) {
                        s[0] = (r / (TARGET - 1)) * (srcN - 1);
                        s[1] = (g / (TARGET - 1)) * (srcN - 1);
                        s[2] = (b / (TARGET - 1)) * (srcN - 1);
                        const r0 = Math.min(Math.floor(s[0]), srcN - 1);
                        const g0 = Math.min(Math.floor(s[1]), srcN - 1);
                        const b0 = Math.min(Math.floor(s[2]), srcN - 1);
                        const r1 = Math.min(r0 + 1, srcN - 1);
                        const g1 = Math.min(g0 + 1, srcN - 1);
                        const b1 = Math.min(b0 + 1, srcN - 1);
                        const dr = s[0] - r0, dg = s[1] - g0, db = s[2] - b0;
                        const nn = srcN * srcN;
                        const i000 = (b0 * nn + g0 * srcN + r0) * 3;
                        const i100 = (b0 * nn + g0 * srcN + r1) * 3;
                        const i010 = (b0 * nn + g1 * srcN + r0) * 3;
                        const i110 = (b0 * nn + g1 * srcN + r1) * 3;
                        const i001 = (b1 * nn + g0 * srcN + r0) * 3;
                        const i101 = (b1 * nn + g0 * srcN + r1) * 3;
                        const i011 = (b1 * nn + g1 * srcN + r0) * 3;
                        const i111 = (b1 * nn + g1 * srcN + r1) * 3;
                        const oi = (b * n + g * TARGET + r) * 3;
                        for (let c = 0; c < 3; c++) {
                            const c00 = table[i000 + c] * (1 - dr) + table[i100 + c] * dr;
                            const c01 = table[i001 + c] * (1 - dr) + table[i101 + c] * dr;
                            const c10 = table[i010 + c] * (1 - dr) + table[i110 + c] * dr;
                            const c11 = table[i011 + c] * (1 - dr) + table[i111 + c] * dr;
                            const c0 = c00 * (1 - dg) + c10 * dg;
                            const c1 = c01 * (1 - dg) + c11 * dg;
                            out[oi + c] = c0 * (1 - db) + c1 * db;
                        }
                    }
                }
            }
            table = out;
            size = TARGET;
        }
        return { size, table };
    }

    function applyLUTToPixels(srcPixels, w, h, lut) {
        const { size, table } = lut;
        const maxIdx = size - 1;
        const n = size * size;
        const dst = new Uint8ClampedArray(srcPixels.length);

        for (let i = 0; i < srcPixels.length; i += 4) {
            const r = srcPixels[i]     / 255;
            const g = srcPixels[i + 1] / 255;
            const b = srcPixels[i + 2] / 255;
            const a = srcPixels[i + 3];

            const rf = Math.min(r * maxIdx, maxIdx);
            const gf = Math.min(g * maxIdx, maxIdx);
            const bf = Math.min(b * maxIdx, maxIdx);

            const r0 = Math.floor(rf);
            const g0 = Math.floor(gf);
            const b0 = Math.floor(bf);
            const r1 = Math.min(r0 + 1, maxIdx);
            const g1 = Math.min(g0 + 1, maxIdx);
            const b1 = Math.min(b0 + 1, maxIdx);

            const dr = rf - r0;
            const dg = gf - g0;
            const db = bf - b0;

            const idx000 = (b0 * n + g0 * size + r0) * 3;
            const idx100 = (b0 * n + g0 * size + r1) * 3;
            const idx010 = (b0 * n + g1 * size + r0) * 3;
            const idx110 = (b0 * n + g1 * size + r1) * 3;
            const idx001 = (b1 * n + g0 * size + r0) * 3;
            const idx101 = (b1 * n + g0 * size + r1) * 3;
            const idx011 = (b1 * n + g1 * size + r0) * 3;
            const idx111 = (b1 * n + g1 * size + r1) * 3;

            for (let c = 0; c < 3; c++) {
                const c00 = table[idx000 + c] * (1 - dr) + table[idx100 + c] * dr;
                const c01 = table[idx001 + c] * (1 - dr) + table[idx101 + c] * dr;
                const c10 = table[idx010 + c] * (1 - dr) + table[idx110 + c] * dr;
                const c11 = table[idx011 + c] * (1 - dr) + table[idx111 + c] * dr;
                const c0  = c00 * (1 - dg) + c10 * dg;
                const c1  = c01 * (1 - dg) + c11 * dg;
                const val = c0 * (1 - db) + c1 * db;
                dst[i + c] = Math.round(Math.max(0, Math.min(1, val)) * 255);
            }
            dst[i + 3] = a;
        }
        return dst;
    }

    // =====================================================================
    //  光影 / 颗粒 效果（独立于 LUT 的另外两个创意维度，可叠加）
    // =====================================================================

    // 效果预设定义。key 同时作为渲染/缓存标识；alg 指向具体算法。
    const EFFECTS = {
        light: [
            { key: 'none',      name: '无光影',   alg: null,            desc: '保持原始光线', badge: 'effect-none-badge', letter: '–' },
            { key: 'leak',      name: '复古漏光', alg: 'retroLeak',     desc: '暖色光晕由边缘漫入，胶片漏光感', badge: 'light-badge', letter: '漏' },
            { key: 'vignette',  name: '胶片暗角', alg: 'filmVignette',  desc: '四角压暗、中心提亮，镜头暗角', badge: 'light-badge', letter: '角' },
            { key: 'glow',      name: '魅力光晕', alg: 'charmGlow',     desc: '中心高光柔和晕开，梦幻通透', badge: 'light-badge', letter: '晕' },
            { key: 'coolfill',  name: '蓝调阴影', alg: 'coolFill',      desc: '暗部补冷蓝调，日系小清新', badge: 'light-badge', letter: '蓝' },
            { key: 'goldenhour',name: '暖阳时刻', alg: 'goldenHour',    desc: '暗部暖橙、亮部微曝，夕阳氛围', badge: 'light-badge', letter: '暖' },
            { key: 'spotlight', name: '聚光灯',   alg: 'spotlight',     desc: '中心径向提亮，如打一盏灯', badge: 'light-badge', letter: '灯' }
        ],
        grain: [
            { key: 'none',   name: '无颗粒',   alg: null,            desc: '保持干净画面', badge: 'effect-none-badge', letter: '–' },
            { key: 'kgold',  name: '柯达暖粒', alg: 'kodakGold',      desc: 'Kodak 暖调颗粒，柔和怀旧', badge: 'grain-badge', letter: 'K' },
            { key: 'delta',  name: '银盐细粒', alg: 'ilfordDelta',    desc: 'Ilford 银盐颗粒，细锐中性', badge: 'grain-badge', letter: 'Δ' }
        ]
    };

    // ---- 光影算法（方案B：基于亮度与空间的“重打光”近似） ----

    // 复古漏光：暖色光斑由某侧边缘漫入（位置/光带方向/强度由 seed 随机决定），按 screen 混合。
    // seed 为 null 时退回固定中心（左上方），保证基础可用。
    function applyLightRetroLeak(px, w, h, seed) {
        const s = seed || { lxp: 0.18, lyp: 0.22, ang: -Math.PI * 0.75, bandOff: 0, amp: 1 };
        const lx = w * s.lxp;
        const ly = h * s.lyp;
        const maxd = Math.sqrt(w * w + h * h);
        const amp = s.amp;
        const ax = Math.cos(s.ang), ay = Math.sin(s.ang);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                // 光晕强度：近光源强
                const d = Math.sqrt((x - lx) * (x - lx) + (y - ly) * (y - ly));
                let glow = 1 - d / (maxd * 0.62);
                glow = Math.max(0, glow);
                glow = glow * glow;
                // 沿 seed 方向的暖光带：投影到光带轴，偏离 bandOff 越近越强
                const proj = ((x / w) - 0.5) * ax + ((y / h) - 0.5) * ay;
                const band = Math.max(0, 1 - Math.abs(proj - s.bandOff) * 2.2);
                const intensity = Math.min(1, glow * 0.85 * amp + band * 0.5 * amp);
                // 暖色光（橙金），screen 混合
                const r = px[i], g = px[i + 1], b = px[i + 2];
                const lr = 255, lg = 170, lb = 80;
                const nr = 255 - (255 - r) * (255 - lr * intensity) / 255;
                const ng = 255 - (255 - g) * (255 - lg * intensity) / 255;
                const nb = 255 - (255 - b) * (255 - lb * intensity) / 255;
                px[i]     = Math.min(255, nr);
                px[i + 1] = Math.min(255, ng);
                px[i + 2] = Math.min(255, nb);
            }
        }
    }

    // 生成一个随机漏光种子：光源落在某边/角，光带方向随机，强度抖动。
    function makeLeakSeed() {
        const spots = [
            [0.12, 0.15], [0.88, 0.15], [0.12, 0.85], [0.88, 0.85],
            [0.5, 0.10], [0.5, 0.90], [0.10, 0.5], [0.90, 0.5]
        ];
        const c = spots[Math.floor(Math.random() * spots.length)];
        return {
            lxp: Math.min(0.95, Math.max(0.05, c[0] + (Math.random() - 0.5) * 0.12)),
            lyp: Math.min(0.95, Math.max(0.05, c[1] + (Math.random() - 0.5) * 0.12)),
            ang: Math.random() * Math.PI * 2,
            bandOff: (Math.random() - 0.5) * 0.5,
            amp: 0.85 + Math.random() * 0.3
        };
    }

    // 胶片暗角：径向压暗四角、轻微提升中心对比，营造镜头暗角。
    function applyLightFilmVignette(px, w, h) {
        const cx = w * 0.5, cy = h * 0.5;
        const maxd = Math.sqrt(cx * cx + cy * cy);
        const strength = 0.55;     // 暗角强度
        const feather = 0.75;      // 羽化范围（越大暗角越靠边）
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxd;
                // 归一化距离 -> 暗角系数
                let v = 1 - strength * Math.pow(Math.min(1, Math.max(0, (d - (1 - feather)) / feather)), 1.6);
                v = Math.max(0.35, v);
                px[i]     = px[i] * v;
                px[i + 1] = px[i + 1] * v;
                px[i + 2] = px[i + 2] * v;
            }
        }
    }

    // 魅力光晕：提取高亮区域，向外做柔和径向晕开（bloom），叠加 screen 混合。
    // 近似 Snapseed「魅力光晕」：画面更梦幻、更通透。
    function applyLightCharmGlow(px, w, h) {
        const cx = w * 0.5, cy = h * 0.5;
        const maxd = Math.sqrt(cx * cx + cy * cy);
        const glowStrength = 0.5;   // 光晕强度
        const threshold = 0.62;     // 仅高亮区参与发光
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const lum = (px[i] + px[i + 1] + px[i + 2]) / (3 * 255);
                // 高光权重：越亮越参与
                const hi = Math.max(0, lum - threshold) / (1 - threshold);
                if (hi <= 0) continue;
                // 离中心越远光晕略弱（柔和扩散）
                const d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxd;
                const falloff = 1 - 0.35 * d;
                const intensity = hi * glowStrength * falloff;
                const r = px[i], g = px[i + 1], b = px[i + 2];
                // 用像素自身颜色做 screen 发光，保持色相
                const nr = 255 - (255 - r) * (255 - r * intensity) / 255;
                const ng = 255 - (255 - g) * (255 - g * intensity) / 255;
                const nb = 255 - (255 - b) * (255 - b * intensity) / 255;
                px[i]     = Math.min(255, nr);
                px[i + 1] = Math.min(255, ng);
                px[i + 2] = Math.min(255, nb);
            }
        }
    }

    // 蓝调阴影：对暗部补一层冷蓝调，亮部基本不动。日系 / 窗边光核心。
    function applyLightCoolFill(px, w, h) {
        const strength = 0.22;      // 冷调强度
        for (let i = 0; i < px.length; i += 4) {
            const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
            // 暗部权重（越暗补得越多）
            const shadow = Math.max(0, 1 - lum / 140);
            const k = strength * shadow;
            if (k <= 0) continue;
            px[i]     = Math.min(255, px[i] - k * 22);   // 红略减
            px[i + 1] = Math.min(255, px[i + 1] - k * 6); // 绿微减
            px[i + 2] = Math.min(255, px[i + 2] + k * 46); // 蓝增
        }
    }

    // 暖阳时刻：整体对比略降，暗部加暖橙、亮部微微过曝泛黄，模拟夕阳。
    function applyLightGoldenHour(px, w, h) {
        const warmStrength = 0.16;  // 暖调强度
        const lift = 10;            // 整体提亮
        for (let i = 0; i < px.length; i += 4) {
            const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
            // 暗部暖得更明显，亮部轻微过曝泛黄
            const shadow = Math.max(0, 1 - lum / 170);
            const k = warmStrength * (0.5 + 0.5 * shadow);
            px[i]     = Math.min(255, px[i] + lift + k * 40);       // 红增（暖）
            px[i + 1] = Math.min(255, px[i + 1] + lift + k * 18);   // 绿微增
            px[i + 2] = Math.min(255, px[i + 2] + lift - k * 26);   // 蓝减
        }
    }

    // 聚光灯：以画面中心为光源做径向提亮，越靠中心越亮，边缘自然衰减。
    function applyLightSpotlight(px, w, h) {
        const cx = w * 0.5, cy = h * 0.5;
        const maxd = Math.sqrt(cx * cx + cy * cy);
        const strength = 0.45;      // 提亮强度
        const feather = 0.9;        // 衰减范围（越大光斑越大）
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy)) / maxd;
                const t = Math.min(1, Math.max(0, (1 - d) / feather));
                const boost = strength * (t * t);
                px[i]     = Math.min(255, px[i] + boost * 70);
                px[i + 1] = Math.min(255, px[i + 1] + boost * 70);
                px[i + 2] = Math.min(255, px[i + 2] + boost * 68);
            }
        }
    }

    function applyLight(px, w, h, alg) {
        if (!alg) return;
        if (alg === 'retroLeak') applyLightRetroLeak(px, w, h, leakSeed);
        else if (alg === 'filmVignette') applyLightFilmVignette(px, w, h);
        else if (alg === 'charmGlow') applyLightCharmGlow(px, w, h);
        else if (alg === 'coolFill') applyLightCoolFill(px, w, h);
        else if (alg === 'goldenHour') applyLightGoldenHour(px, w, h);
        else if (alg === 'spotlight') applyLightSpotlight(px, w, h);
    }

    // ---- 颗粒算法 ----

    function rand255() { return (Math.random() * 2 - 1) * 255; }

    // 柯达暖粒：均匀噪点 + 暖色偏移，幅度中等，阴影略重。
    function applyGrainKodakGold(px, w, h) {
        const amount = 18;
        const warm = 6;
        for (let i = 0; i < px.length; i += 4) {
            const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
            const k = amount * (0.7 + 0.3 * (1 - lum / 255));
            const n = rand255() * (k / 255);
            px[i]     = Math.min(255, Math.max(0, px[i] + n + warm * 0.6));
            px[i + 1] = Math.min(255, Math.max(0, px[i + 1] + n));
            px[i + 2] = Math.min(255, Math.max(0, px[i + 2] + n - warm * 0.4));
        }
    }

    // 银盐细粒：更细锐、中性，颗粒强度随亮度变化（中间调最明显）。
    function applyGrainIlfordDelta(px, w, h) {
        const amount = 14;
        for (let i = 0; i < px.length; i += 4) {
            const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
            // 中间调颗粒最强，高光/暗部减弱
            const mid = 1 - Math.abs(lum - 128) / 128;
            const k = amount * (0.35 + 0.65 * mid);
            const n = rand255() * (k / 255);
            px[i]     = Math.min(255, Math.max(0, px[i] + n));
            px[i + 1] = Math.min(255, Math.max(0, px[i + 1] + n));
            px[i + 2] = Math.min(255, Math.max(0, px[i + 2] + n));
        }
    }

    function applyGrain(px, w, h, alg) {
        if (!alg) return;
        if (alg === 'kodakGold') applyGrainKodakGold(px, w, h);
        else if (alg === 'ilfordDelta') applyGrainIlfordDelta(px, w, h);
    }

    // 统一应用：LUT -> 光影 -> 颗粒（顺序固定，可叠加）
    function applyAll(srcPixels, w, h) {
        let px = srcPixels;
        if (lutData) px = applyLUTToPixels(px, w, h, lutData);
        if (currentLightAlg) {
            // applyLight 直接修改数组，这里用副本避免污染源
            const copy = px === srcPixels ? px.slice() : px;
            applyLight(copy, w, h, currentLightAlg);
            px = copy;
        }
        if (currentGrainAlg) {
            const copy = px.slice();
            applyGrain(copy, w, h, currentGrainAlg);
            px = copy;
        }
        return px;
    }

    function renderCacheKey() {
        let lightPart = currentLightKey || 'none';
        if (lightPart === 'leak' && leakSeed) {
            // 把随机种子编码进 key，使不同漏光形态互不覆盖且可命中缓存
            lightPart = 'leak@'
                + leakSeed.lxp.toFixed(3) + ','
                + leakSeed.lyp.toFixed(3) + ','
                + leakSeed.ang.toFixed(3) + ','
                + leakSeed.bandOff.toFixed(3) + ','
                + leakSeed.amp.toFixed(3);
        }
        return (currentImageId || 'img') + '::'
            + (selectedLutKey || 'original') + '::'
            + lightPart + '::'
            + (currentGrainKey || 'none');
    }

    function previewDims() {
        const nw = sourceImage.naturalWidth || sourceImage.width;
        const nh = sourceImage.naturalHeight || sourceImage.height;
        const scale = Math.min(1, PREVIEW_MAX / Math.max(nw, nh));
        return { w: Math.max(1, Math.round(nw * scale)), h: Math.max(1, Math.round(nh * scale)) };
    }

    function render() {
        if (!sourceImage) return;
        const key = renderCacheKey();
        const cached = renderCache.get(key);
        if (cached) {
            // 命中渲染缓存：直接绘制，跳过全图 getImageData + 逐像素应用
            renderCache.delete(key);
            renderCache.set(key, cached);
            canvas.width = cached.width;
            canvas.height = cached.height;
            ctx.drawImage(cached, 0, 0);
            return;
        }
        // 预览按降分辨率渲染（PREVIEW_MAX），导出时再单独跑全分辨率
        const { w, h } = previewDims();
        paintCanvas(canvas, w, h);
        cacheRender(key, canvas);
    }

    // 把 sourceImage 按给定尺寸绘制并套用 风格+光影+颗粒，写入 targetCanvas
    function paintCanvas(targetCanvas, w, h) {
        targetCanvas.width = w;
        targetCanvas.height = h;
        const tctx = targetCanvas.getContext('2d');
        tctx.drawImage(sourceImage, 0, 0, w, h);
        const imageData = tctx.getImageData(0, 0, w, h);
        // 注意：applyAll 内部会做副本，不会污染原始像素
        imageData.data.set(applyAll(imageData.data, w, h));
        tctx.putImageData(imageData, 0, 0);
    }

    function cacheRender(key, srcCanvas) {
        const off = document.createElement('canvas');
        off.width = srcCanvas.width;
        off.height = srcCanvas.height;
        off.getContext('2d').drawImage(srcCanvas, 0, 0);
        renderCache.set(key, off);
        while (renderCache.size > RENDER_CACHE_MAX) {
            const oldest = renderCache.keys().next().value;
            renderCache.delete(oldest);
        }
    }

    // 选图后后台预渲染全部风格（降分辨率），使之后点哪个都秒出
    let prerenderToken = 0;
    async function prerenderAll() {
        if (!sourceImage || !categoryOrder || !lutIndex) return;
        const token = ++prerenderToken;
        const imgId = currentImageId || 'img';
        const { w, h } = previewDims();
        const savedLut = lutData, savedLight = currentLightAlg, savedGrain = currentGrainAlg;
        for (const key of categoryOrder) {
            for (const fname of (lutIndex[key] || [])) {
                if (token !== prerenderToken) return; // 图片已切换，中止后台任务
                const styleKey = lutPath(fname);
                const rk = imgId + '::' + styleKey + '::none::none';
                if (renderCache.has(rk)) continue; // 已渲染（如用户已点过）
                try {
                    const text = await loadLutContent(key, fname);
                    const pkey = styleKey;
                    let lut = lutParseCache.get(pkey);
                    if (!lut) { lut = parseCubeFile(text); lutParseCache.set(pkey, lut); }
                    lutData = lut; currentLightAlg = null; currentGrainAlg = null;
                    const off = document.createElement('canvas');
                    paintCanvas(off, w, h);
                    renderCache.set(rk, off);
                    while (renderCache.size > RENDER_CACHE_MAX) {
                        const oldest = renderCache.keys().next().value;
                        renderCache.delete(oldest);
                    }
                } catch (e) { console.warn('预渲染失败（已跳过）:', styleKey, e); }
                await new Promise(r => setTimeout(r, 0)); // 让出主线程，避免卡顿
            }
        }
        lutData = savedLut; currentLightAlg = savedLight; currentGrainAlg = savedGrain;
    }

    function buildPresets() {
        if (!lutIndex) return;
        presetsScroll.innerHTML = '';

        let total = 0;
        const categories = (categoryOrder || Object.keys(lutIndex)).map(key => {
            return { key, label: getCategoryTitle(key) };
        });

        const allCategories = categories;

        for (const cat of allCategories) {
            const categoryEl = document.createElement('div');
            categoryEl.className = 'preset-category cat-' + cat.key.replace(/\s+/g, '-');
            const files = lutIndex[cat.key] || [];
            if (!files.length) continue;
            total += files.length;

            const titleText = getCategoryTitle(cat.key);
            if (titleText) {
                categoryEl.innerHTML = '<div class="category-title">' + titleText
                    + '<span class="tier-count">' + files.length + '</span></div>';
            }

            const list = document.createElement('div');
            list.className = 'preset-list';

            for (const fname of files) {
                const display = formatLutName(cat.key, fname);
                const key = lutPath(fname);
                const item = document.createElement('div');
                item.className = 'preset-item';
                if (selectedLutKey === key) item.classList.add('selected');
                item.innerHTML = `
                    <div class="preset-badge" style="background:${getLutColor(cat.key, fname)}">${display.charAt(0)}</div>
                    <div class="preset-info">
                        <div class="preset-name">${display}</div>
                        <div class="preset-category-label">${getLutDesc(cat.key, fname)}</div>
                    </div>
                    <div class="preset-check">✓</div>
                `;
                item.addEventListener('click', () => selectLut(cat.key, fname));
                list.appendChild(item);
            }

            categoryEl.appendChild(list);
            presetsScroll.appendChild(categoryEl);
        }

        presetCount.textContent = total + ' preset' + (total === 1 ? '' : 's');
    }

    // ---- 其它风格：读取 other luts/ 目录清单并按子文件夹分组渲染 ----
    // 清单格式见 other-luts-list.json：{ dir, groups:[{ label, dir, files:[...] }] }
    // files 中的文件名若不含 "/"，表示该组子文件夹下的文件；含 "/" 则视为相对 other luts 的路径
    async function loadDownloadList() {
        try {
            const res = await fetch(lutAbsUrl('other-luts-list.json'), { cache: 'no-cache' });
            if (!res.ok) throw new Error('清单读取失败');
            const data = await res.json();
            const groups = (data.groups || []).map(g => {
                const baseDir = g.dir || '';
                return {
                    label: g.label || baseDir || '其它',
                    dir: baseDir,
                    files: (g.files || []).map(f => baseDir ? baseDir + '/' + f : f)
                };
            }).filter(g => g.files.length);
            downloadGroups = groups;
            downloadLuts = groups.reduce((acc, g) => acc.concat(g.files), []);
            // 首次加载：默认只展开第一个分组，其余收起；记录状态以便重建列表时保持
            downloadOpenDirs = new Set(downloadGroups.length ? [downloadGroups[0].dir] : []);
            buildDownloadList();
            refreshDownloadPreloadState();
        } catch (e) {
            console.warn('其它风格清单加载失败:', e);
            downloadListScroll.innerHTML = '<div class="empty-state">其它风格清单加载失败</div>';
        }
    }

    function buildDownloadList() {
        downloadListScroll.innerHTML = '';
        downloadCount.textContent = downloadLuts.length + ' preset' + (downloadLuts.length === 1 ? '' : 's');
        preloadDownloadBtn.hidden = downloadLuts.length === 0;
        preloadDownloadProgress.hidden = true;

        if (!downloadGroups.length) {
            downloadListScroll.innerHTML = '<div class="empty-state">暂无其它风格</div>';
            return;
        }

        downloadGroups.forEach((grp) => {
            const categoryEl = document.createElement('div');
            const isOpen = downloadOpenDirs.has(grp.dir);
            categoryEl.className = 'preset-category cat-download'
                + (isOpen ? ' cat-open' : ' cat-collapsed');
            const title = document.createElement('div');
            title.className = 'category-title';
            const titleLeft = document.createElement('span');
            titleLeft.className = 'category-title-left';
            titleLeft.innerHTML = '<span class="cat-arrow">▸</span>'
                + '<span class="cat-label">' + escapeHtml(grp.label) + '</span>';
            const count = document.createElement('span');
            count.className = 'tier-count';
            count.textContent = grp.files.length;
            title.appendChild(titleLeft);
            title.appendChild(count);
            title.addEventListener('click', () => {
                if (downloadOpenDirs.has(grp.dir)) {
                    downloadOpenDirs.delete(grp.dir);
                } else {
                    downloadOpenDirs.add(grp.dir);
                }
                categoryEl.classList.toggle('cat-collapsed');
                categoryEl.classList.toggle('cat-open');
            });

            const list = document.createElement('div');
            list.className = 'preset-list';
            for (const fname of grp.files) {
                const key = downloadPath(fname);
                const item = document.createElement('div');
                item.className = 'preset-item' + (selectedLutKey === key ? ' selected' : '');
                item.dataset.key = key;
                const nameEl = document.createElement('div');
                nameEl.className = 'preset-name';
                nameEl.textContent = fname.split('/').pop().replace(/\.cube$/i, '');
                const check = document.createElement('span');
                check.className = 'preset-check';
                check.textContent = '✓';
                item.appendChild(nameEl);
                item.appendChild(check);
                item.addEventListener('click', () => selectDownloadLut(fname));
                list.appendChild(item);
            }
            categoryEl.appendChild(title);
            categoryEl.appendChild(list);
            downloadListScroll.appendChild(categoryEl);
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // 仅更新其它风格列表的选中高亮，不重建 DOM（避免重置分组折叠状态）
    function updateDownloadSelection() {
        downloadListScroll.querySelectorAll('.preset-item').forEach(item => {
            item.classList.toggle('selected', item.dataset.key === selectedLutKey);
        });
    }

    // 选中其它风格：与排名风格互斥（selectedLutKey 唯一）
    async function selectDownloadLut(filename) {
        showOriginal = false;
        updateOriginalSwitch();
        const key = downloadPath(filename);
        selectedLutKey = key;
        currentStyleKey = key;
        leakSeed = null;
        currentLightAlg = null;
        currentGrainAlg = null;
        try {
            const text = await fetchLutFile(key);
            const lut = parseCubeFile(text);
            lutData = lut;
        } catch (e) {
            console.warn('其它风格加载失败:', filename, e);
            return;
        }
        // 互斥：更新两边列表的高亮（不重建，保留折叠状态）
        buildPresets();
        updateDownloadSelection();
        render();
    }

    // 下载风格的全部 LUT 绝对 URL（用于缓存预加载与状态检查）
    function downloadLutUrls() {
        return downloadLuts.map(f => lutAbsUrl(downloadPath(f)));
    }

    function setDownloadPreloadUI(state, done, total) {
        if (state === 'idle') {
            preloadDownloadBtn.hidden = false;
            preloadDownloadProgress.hidden = true;
            preloadDownloadBtn.textContent = '预加载';
            preloadDownloadBtn.disabled = false;
        } else if (state === 'running') {
            preloadDownloadBtn.hidden = true;
            preloadDownloadProgress.hidden = false;
            const pct = total ? Math.round((done / total) * 100) : 0;
            preloadDownloadBarFill.style.width = pct + '%';
            preloadDownloadText.textContent = done + ' / ' + total + '  (' + pct + '%)';
        } else if (state === 'done') {
            preloadDownloadBtn.hidden = false;
            preloadDownloadProgress.hidden = true;
            preloadDownloadBtn.textContent = '✓ 已预加载 (' + done + '/' + total + ')';
            preloadDownloadBtn.disabled = false;
        }
    }

    // 进入页面时，根据 Cache Storage 命中情况刷新下载风格按钮文案（与自制风格一致，刷新后保留）
    async function refreshDownloadPreloadState() {
        if (!('caches' in window)) return;
        const items = downloadLutUrls();
        if (!items.length) return;
        try {
            const cache = await caches.open(LUT_CACHE);
            let cached = 0;
            for (const url of items) {
                if (await cache.match(url)) cached++;
            }
            if (cached === items.length) {
                setDownloadPreloadUI('done', cached, items.length);
            } else if (cached > 0) {
                preloadDownloadBtn.hidden = false;
                preloadDownloadProgress.hidden = true;
                preloadDownloadBtn.textContent = '继续预加载 (' + cached + '/' + items.length + ')';
                preloadDownloadBtn.disabled = false;
            }
        } catch (e) { /* 忽略 */ }
    }

    // 预加载其它风格：先把全部 .cube 写入 Cache Storage（刷新后保持已完成状态），若有图再预渲染到内存缓存实现秒出
    async function prerenderDownload() {
        if (downloadLuts.length === 0) return;
        if (!('caches' in window)) {
            alert('当前浏览器不支持缓存预加载，请改用现代浏览器（Chrome / Edge / Firefox / Safari）。');
            return;
        }
        const total = downloadLuts.length;
        const urls = downloadLutUrls();
        setDownloadPreloadUI('running', 0, total);
        let done = 0;
        try {
            const cache = await caches.open(LUT_CACHE);
            for (const url of urls) {
                try {
                    const hit = await cache.match(url);
                    if (!hit) {
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        await cache.put(url, resp.clone());
                    }
                } catch (e) {
                    console.warn('其它风格预加载失败（已跳过）:', url, e);
                }
                done++;
                setDownloadPreloadUI('running', done, total);
                await new Promise(r => setTimeout(r, 0));
            }
        } catch (e) {
            console.error('其它风格预加载异常:', e);
        }
        setDownloadPreloadUI('done', done, total);
        // 有图时顺带把效果预渲染进内存缓存，保证点选秒出
        if (sourceImage) {
            const imgId = currentImageId || 'img';
            const { w, h } = previewDims();
            const savedLut = lutData, savedLight = currentLightAlg, savedGrain = currentGrainAlg;
            for (const fname of downloadLuts) {
                const key = downloadPath(fname);
                const rk = imgId + '::' + key + '::none::none';
                if (renderCache.has(rk)) continue;
                try {
                    const text = await fetchLutFile(key);
                    const lut = parseCubeFile(text);
                    lutData = lut; currentLightAlg = null; currentGrainAlg = null;
                    const off = document.createElement('canvas');
                    paintCanvas(off, w, h);
                    renderCache.set(rk, off);
                    while (renderCache.size > RENDER_CACHE_MAX) {
                        const oldest = renderCache.keys().next().value;
                        renderCache.delete(oldest);
                    }
                } catch (e) { console.warn('其它风格预渲染失败（已跳过）:', fname, e); }
                await new Promise(r => setTimeout(r, 0));
            }
            lutData = savedLut; currentLightAlg = savedLight; currentGrainAlg = savedGrain;
        }
    }

    // ---- 光影 / 颗粒 列表渲染 ----
    function buildEffectList(dim, scrollEl, selectedKey) {
        scrollEl.innerHTML = '';
        const list = document.createElement('div');
        list.className = 'preset-list';
        for (const e of EFFECTS[dim]) {
            const item = document.createElement('div');
            item.className = 'preset-item';
            if (selectedKey === e.key) item.classList.add('selected');
            const badgeClass = e.badge ? e.badge : 'preset-badge';
            item.innerHTML = `
                <div class="preset-badge ${badgeClass}">${e.letter}</div>
                <div class="preset-info">
                    <div class="preset-name">${e.name}</div>
                    <div class="preset-category-label">${e.desc}</div>
                </div>
                <div class="preset-check">✓</div>
            `;
            item.addEventListener('click', () => {
                if (dim === 'light') selectLight(e.key);
                else selectGrain(e.key);
            });
            list.appendChild(item);
        }
        scrollEl.appendChild(list);
    }

    function buildLightList() {
        buildEffectList('light', lightListScroll, currentLightKey);
    }

    function buildGrainList() {
        buildEffectList('grain', grainListScroll, currentGrainKey);
    }

    async function selectLut(category, filename) {
        const key = category === DOWNLOAD_DIR ? downloadPath(filename) : lutPath(filename);
        currentStyleKey = key;
        showOriginal = false;
        updateOriginalSwitch();
        selectedLutKey = currentStyleKey;
        // 渲染缓存已命中时 Everything 都已本地就绪，无需再显示等待遮罩
        const instant = renderCache.has(renderCacheKey());
        if (!instant) loadingOverlay.classList.add('visible');
        buildPresets();
        updateDownloadSelection();

        try {
            const text = await loadLutContent(category, filename);
            const pkey = key;
            let lut = lutParseCache.get(pkey);
            if (!lut) {
                lut = parseCubeFile(text);
                lutParseCache.set(pkey, lut);
            }
            lutData = lut;
            render();
        } catch (err) {
            alert('LUT 加载失败: ' + err.message);
            selectedLutKey = null;
            lutData = null;
            buildPresets();
            updateDownloadSelection();
        } finally {
            loadingOverlay.classList.remove('visible');
        }
    }

    async function selectLight(key) {
        showOriginal = false;
        updateOriginalSwitch();
        currentLightKey = key;
        const def = EFFECTS.light.find(e => e.key === key);
        currentLightAlg = def ? def.alg : null;
        // 复古漏光：仅在首次选中（无种子）时随机一次；切走其他效果则清空种子
        if (key === 'leak') {
            if (!leakSeed) leakSeed = makeLeakSeed();
        } else {
            leakSeed = null;
        }
        const instant = renderCache.has(renderCacheKey());
        if (!instant) loadingOverlay.classList.add('visible');
        buildLightList();
        updateLeakRerollBtn();
        render();
        loadingOverlay.classList.remove('visible');
    }

    // 重掷复古漏光：生成新随机种子并重新渲染（仅 leak 有效）
    async function rerollLeak() {
        if (currentLightKey !== 'leak') return;
        leakSeed = makeLeakSeed();
        const instant = renderCache.has(renderCacheKey());
        if (!instant) loadingOverlay.classList.add('visible');
        render();
        loadingOverlay.classList.remove('visible');
    }

    async function selectGrain(key) {
        showOriginal = false;
        updateOriginalSwitch();
        currentGrainKey = key;
        const def = EFFECTS.grain.find(e => e.key === key);
        currentGrainAlg = def ? def.alg : null;
        const instant = renderCache.has(renderCacheKey());
        if (!instant) loadingOverlay.classList.add('visible');
        buildGrainList();
        render();
        loadingOverlay.classList.remove('visible');
    }

    function updateOriginalSwitch() {
        originalSwitch.classList.toggle('on', showOriginal);
        originalSwitch.setAttribute('aria-checked', showOriginal ? 'true' : 'false');
    }

    // 仅当选中「复古漏光」时显示「🎲 换漏光」按钮
    function updateLeakRerollBtn() {
        leakRerollBtn.hidden = !(currentLightKey === 'leak' && !showOriginal);
    }

    // 原图开关：on=显示纯原图（关闭风格+光影+颗粒），off=恢复当前三维选择
    function setShowOriginal(on) {
        showOriginal = on;
        updateOriginalSwitch();
        updateLeakRerollBtn();
        if (on) {
            selectedLutKey = null;
            lutData = null;
            currentLightAlg = null;
            currentGrainAlg = null;
            buildPresets();
            buildLightList();
            buildGrainList();
            render();
        } else {
            if (!currentStyleKey) currentStyleKey = getFirstStyleKey();
            if (currentStyleKey) {
                const [cat, fname] = splitStyleKey(currentStyleKey);
                selectLut(cat, fname);
            } else {
                selectedLutKey = null;
                lutData = null;
                buildPresets();
                render();
            }
        }
    }

    function setImageLoaded(img, name) {
        // 换了图片，旧的渲染缓存（按 imageId 区分）已失效，清空释放内存
        renderCache.clear();
        sourceImage = img;
        hasImage = true;
        preview.classList.add('has-image');
        canvas.classList.add('visible');
        downloadBtn.disabled = false;
        currentImageName = name || 'image.jpg';
        // 默认选中第一个风格，原图开关关闭
        currentStyleKey = getFirstStyleKey();
        showOriginal = false;
        updateOriginalSwitch();
        if (currentStyleKey) {
            const [cat, fname] = splitStyleKey(currentStyleKey);
            selectLut(cat, fname);
        } else {
            selectedLutKey = null;
            lutData = null;
            buildPresets();
            render();
        }
        // 选图后后台预渲染全部风格，使之后点哪个都秒出（不再有"应用Lut中"）
        prerenderAll();
    }

    async function loadImageFromDB(id) {
        const item = await getImage(id);
        if (!item) {
            alert('找不到该图片，将返回列表');
            location.href = 'index.html';
            return;
        }
        currentImageId = id;
        currentImageName = item.name;
        const img = new Image();
        img.onload = () => setImageLoaded(img, item.name);
        img.src = item.dataUrl;
    }

    async function handleImageFile(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('请选择有效的图片文件（JPG / PNG / WebP）');
            return;
        }
        try {
            const dataUrl = await fileToDataUrl(file);
            const id = await saveImage(file.name, dataUrl);
            location.href = 'editor.html?id=' + encodeURIComponent(id);
        } catch (err) {
            alert('图片保存失败: ' + err.message);
        }
    }

    function downloadImage() {
        if (!hasImage) return;
        const link = document.createElement('a');
        const base = currentImageName.replace(/\.[^/.]+$/, '');
        const parts = [];
        parts.push(selectedLutKey
            ? selectedLutKey.replace(/\//g, '-').replace(/\.(cube|CUBE)$/, '')
            : 'original');
        if (currentLightKey && currentLightKey !== 'none') parts.push('L-' + currentLightKey);
        if (currentGrainKey && currentGrainKey !== 'none') parts.push('G-' + currentGrainKey);
        link.download = base + '-' + parts.join('-') + '.jpg';
        // 导出用原图全分辨率渲染（不受预览降分辨率影响）；JPG 不支持透明通道，先铺白底
        const nw = sourceImage.naturalWidth || sourceImage.width;
        const nh = sourceImage.naturalHeight || sourceImage.height;
        const out = document.createElement('canvas');
        out.width = nw;
        out.height = nh;
        const octx = out.getContext('2d');
        octx.fillStyle = '#ffffff';
        octx.fillRect(0, 0, nw, nh);
        octx.drawImage(sourceImage, 0, 0, nw, nh);
        const imageData = octx.getImageData(0, 0, nw, nh);
        imageData.data.set(applyAll(imageData.data, nw, nh));
        octx.putImageData(imageData, 0, 0);
        link.href = out.toDataURL('image/jpeg', 0.92);
        link.click();
    }

    async function deleteCurrentImage() {
        if (!currentImageId) return;
        if (!confirm('确定要删除这张图片吗？')) return;
        try {
            await deleteImage(currentImageId);
            location.href = 'index.html';
        } catch (err) {
            alert('删除失败: ' + err.message);
        }
    }

    // ---- Events ----
    backBtn.addEventListener('click', () => location.href = 'index.html');
    uploadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        imageInput.click();
    });
    downloadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        downloadImage();
    });
    deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCurrentImage();
    });

    preview.addEventListener('click', () => imageInput.click());
    originalToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        setShowOriginal(!showOriginal);
    });
    leakRerollBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        rerollLeak();
    });
    preloadBtn.addEventListener('click', preloadAll);
    preloadCancel.addEventListener('click', cancelPreload);
    preloadDownloadBtn.addEventListener('click', prerenderDownload);

    // ---- Tab 切换（排名风格 / 其它风格 / 光影 / 颗粒） ----
    const tabs = document.querySelectorAll('.tab');
    const panels = { style: panelStyle, download: panelDownload, light: panelLight, grain: panelGrain };
    function switchTab(name) {
        tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
        Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === name));
    }
    tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleImageFile(e.target.files[0]);
    });

    preview.addEventListener('dragover', (e) => {
        e.preventDefault();
        preview.classList.add('drag-over');
    });

    preview.addEventListener('dragleave', () => {
        preview.classList.remove('drag-over');
    });

    preview.addEventListener('drop', (e) => {
        e.preventDefault();
        preview.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) handleImageFile(e.dataTransfer.files[0]);
    });

    // ---- Init ----
    buildLightList();
    buildGrainList();
    const imageId = getUrlParam('id');
    if (imageId) {
        loadImageFromDB(imageId);
    }
</script>

</body>
</html>
