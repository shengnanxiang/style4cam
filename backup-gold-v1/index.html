<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT Studio</title>
    <style>
        :root {
            --bg: #000000;
            --panel-bg: #0a0a0a;
            --toolbar-bg: #0a0a0a;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.55);
            --text-dim: rgba(255, 255, 255, 0.35);
            --accent: #ff9f43;
            --accent-glow: rgba(255, 159, 67, 0.35);
            --radius: 10px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* ---- Left Toolbar ---- */
        .toolbar {
            width: 64px;
            flex-shrink: 0;
            background: var(--toolbar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 8px;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .tool-btn svg { width: 20px; height: 20px; }

        .tool-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .tool-btn:active { transform: scale(0.95); }

        .tool-btn.accent:hover {
            color: var(--accent);
            background: rgba(255, 159, 67, 0.1);
            border-color: rgba(255, 159, 67, 0.3);
        }

        .tool-btn.danger:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        .tool-divider {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        .tool-spacer { flex: 1; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.12) transparent;
        }

        .main::-webkit-scrollbar { width: 5px; }
        .main::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 3px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .section-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 24px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            background: var(--panel-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .gallery-item:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        .gallery-item.selected {
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-end;
            padding: 10px;
            gap: 8px;
        }

        .gallery-item:hover .gallery-item-overlay { opacity: 1; }

        .gallery-item.selected .gallery-item-overlay {
            opacity: 1;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 50%, transparent 80%);
        }

        .gallery-item-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gallery-item-name {
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .apply-btn {
            display: none;
            width: 100%;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #000;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .apply-btn:hover {
            background: #ffb366;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .gallery-item.selected .apply-btn {
            display: block;
        }

        .gallery-check {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.15s ease;
        }

        .gallery-item.selected .gallery-check { opacity: 1; transform: scale(1); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .empty-icon {
            width: 72px;
            height: 72px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .empty-hint {
            font-size: 13px;
            color: var(--text-dim);
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="app">
    <nav class="toolbar">
        <button class="tool-btn accent" id="uploadBtn" title="上传图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <div class="tool-divider"></div>
        <button class="tool-btn" id="downloadBtn" title="下载选中" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <div class="tool-spacer"></div>
        <button class="tool-btn danger" id="deleteBtn" title="删除选中" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
    </nav>

    <main class="main">
        <div class="section-title">图片列表</div>
        <div class="section-subtitle">点击选中图片，选中后点击「套用风格」进入编辑</div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>
</div>

<input type="file" id="imageInput" accept="image/*">

<script src="db.js"></script>
<script>
    const galleryGrid = document.getElementById('galleryGrid');
    const uploadBtn = document.getElementById('uploadBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const imageInput = document.getElementById('imageInput');

    let allImages = [];
    let selectedId = null;

    function updateToolbar() {
        const hasSelection = selectedId !== null;
        downloadBtn.disabled = !hasSelection;
        deleteBtn.disabled = !hasSelection;
    }

    async function loadGallery() {
        allImages = await getAllImages();
        selectedId = null;
        updateToolbar();
        galleryGrid.innerHTML = '';

        if (allImages.length === 0) {
            galleryGrid.innerHTML = `
                <div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <div class="empty-title">还没有图片</div>
                    <div class="empty-hint">点击左侧上传按钮，开始应用 LUT 风格</div>
                </div>
            `;
            return;
        }

        allImages.sort((a, b) => b.createdAt - a.createdAt);

        for (const img of allImages) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.dataset.id = img.id;
            item.innerHTML = `
                <img src="${img.dataUrl}" alt="${img.name}" loading="lazy">
                <div class="gallery-item-overlay">
                    <div class="gallery-item-name-row">
                        <div class="gallery-item-name">${img.name}</div>
                    </div>
                    <button class="apply-btn">套用风格</button>
                </div>
                <div class="gallery-check">✓</div>
            `;

            item.addEventListener('click', (e) => {
                // If clicking the apply button, navigate
                if (e.target.classList.contains('apply-btn')) {
                    location.href = 'editor.html?id=' + encodeURIComponent(img.id);
                    return;
                }
                if (selectedId === img.id) {
                    // Deselect
                    selectedId = null;
                    item.classList.remove('selected');
                    updateToolbar();
                } else {
                    // Select this one, deselect others
                    if (selectedId) {
                        const prev = galleryGrid.querySelector(`[data-id="${selectedId}"]`);
                        if (prev) prev.classList.remove('selected');
                    }
                    selectedId = img.id;
                    item.classList.add('selected');
                    updateToolbar();
                }
            });

            galleryGrid.appendChild(item);
        }
    }

    async function handleUpload(file) {
        if (!file || !file.type.startsWith('image/')) {
            alert('请选择有效的图片文件（JPG / PNG / WebP）');
            return;
        }
        try {
            const dataUrl = await fileToDataUrl(file);
            const id = await saveImage(file.name, dataUrl);
            location.href = 'editor.html?id=' + encodeURIComponent(id);
        } catch (err) {
            alert('图片保存失败: ' + err.message);
        }
    }

    async function downloadSelected() {
        if (!selectedId) return;
        const img = allImages.find(i => i.id === selectedId);
        if (!img) return;
        const link = document.createElement('a');
        link.download = img.name;
        link.href = img.dataUrl;
        link.click();
    }

    async function deleteSelected() {
        if (!selectedId) return;
        if (!confirm('确定要删除这张图片吗？')) return;
        try {
            await deleteImage(selectedId);
            selectedId = null;
            loadGallery();
        } catch (err) {
            alert('删除失败: ' + err.message);
        }
    }

    uploadBtn.addEventListener('click', () => imageInput.click());
    downloadBtn.addEventListener('click', downloadSelected);
    deleteBtn.addEventListener('click', deleteSelected);

    imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleUpload(e.target.files[0]);
    });

    loadGallery();
</script>

</body>
</html>
